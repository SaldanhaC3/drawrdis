<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Drawrdis</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --ink: #1b1b1f;
    --ink2: #625f6d;
    --paper: #fafafa;
    --bar: #ffffff;
    --line: #e6e6ea;
    --accent: #6965db;
    --accent2: #e0dcff;
    --sel: #6965db;
    --isl-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  [data-theme="dark"] {
    --ink: #e6e6ea;
    --ink2: #9b98a6;
    --paper: #121214;
    --bar: #1e1e22;
    --line: #34343a;
    --accent: #837dff;
    --accent2: #3c3a5c;
    --isl-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
  }
  .isl {
    position: fixed; z-index: 20;
    background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--isl-shadow);
    display: flex; align-items: center;
  }
  button {
    font: 12px 'Segoe UI', system-ui, sans-serif;
    color: var(--ink); background: transparent;
    border: none; border-radius: 8px;
    padding: 6px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  button.on { background: var(--accent2); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:hover { background: transparent; }
  button svg { display: block; }
  .div { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

  #menuBtn { top: 12px; left: 12px; padding: 9px; }
  #tb { top: 12px; left: 50%; transform: translateX(-50%); padding: 4px 6px; gap: 2px; }
  .num { font-size: 9px; opacity: .55; margin-left: -3px; align-self: flex-start; margin-top: 1px; }

  #hint {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    z-index: 15; font-size: 12px; color: var(--ink2);
    background: var(--bar); border: 1px solid var(--line); border-radius: 99px;
    padding: 3px 14px; box-shadow: var(--isl-shadow);
    max-width: 74vw; text-align: center; opacity: .92;
    transition: opacity .2s; pointer-events: none;
  }
  kbd { font: 11px Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bar); }

  #panel {
    position: fixed; z-index: 19; top: 64px; right: 12px;
    width: 248px; max-height: calc(100vh - 150px); overflow-y: auto;
    background: var(--bar); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--isl-shadow); padding: 0;
    display: none; flex-direction: column;
  }
  #panel.show { display: flex; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  #panel .phead {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px;
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  #panel .phead .ptitle { font-size: 14px; font-weight: 600; }
  #panel .phead .pcount { font-size: 12px; color: var(--ink2); margin-left: auto; }
  #panel .pclose { margin-left: 2px; padding: 2px 8px; font-size: 16px; line-height: 1; }
  .sec { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; }
  .sec h4 { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink); }
  .sec .sub { font-size: 11px; font-weight: 500; color: var(--ink2); margin-top: 2px; }
  .sec.off { display: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: flex; gap: 8px; margin: 0; }
  .seg button {
    flex: 1 1 0; height: 36px; min-width: 0; padding: 0;
    border-radius: 10px;
    background: color-mix(in srgb, var(--ink) 6%, transparent);
  }
  .seg button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .seg button.on { background: var(--accent2); box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
  .seg button svg { display: block; margin: 0 auto; }
  .sw { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); padding: 0; }
  .sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sw.custom { margin-left: 10px; box-shadow: inset 0 0 0 2px var(--accent2); border-color: var(--accent); }
  .mini { width: 30px; height: 28px; padding: 0; flex: none; }
  input[type="color"] { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .algrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
  .algrid.al2 { grid-template-columns: repeat(2, 1fr); }
  .algrid button { width: auto; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .algrid button.on { background: var(--accent2); box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }

  #bl { bottom: 12px; left: 12px; padding: 4px 6px; gap: 2px; }
  #zoomLbl { font-size: 12px; color: var(--ink2); min-width: 42px; text-align: center; cursor: pointer; padding: 6px 2px; border-radius: 8px; }
  #zoomLbl:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }

  #br { bottom: 12px; right: 12px; padding: 6px 10px; gap: 10px; font-size: 11px; color: var(--ink2); }
  #live { width: 8px; height: 8px; border-radius: 50%; background: #b9b6c6; display: inline-block; margin-right: 4px; }
  #live.on { background: #3d9a50; }
  #helpBtn { top: auto; bottom: 12px; right: 150px; padding: 9px; position: fixed; z-index: 20; }

  #menu {
    position: fixed; z-index: 30; top: 58px; left: 12px;
    width: 240px; background: var(--bar); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--isl-shadow); padding: 6px;
    display: none; flex-direction: column; gap: 1px;
  }
  #menu.open { display: flex; }
  #menu button { justify-content: flex-start; padding: 8px 10px; font-size: 13px; gap: 10px; }
  #menu .mkey { margin-left: auto; color: var(--ink2); font-size: 11px; }
  #menu hr { border: none; border-top: 1px solid var(--line); margin: 5px 0; }
  #menu .mrow { display: flex; align-items: center; gap: 4px; padding: 6px 10px; }
  #menu .mlbl { font-size: 12px; color: var(--ink2); margin-right: 2px; }

  #help {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35);
    display: none; align-items: center; justify-content: center;
  }
  #help.open { display: flex; }
  #help .card {
    background: var(--bar); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--isl-shadow); padding: 22px 26px; max-width: 560px; max-height: 80vh; overflow: auto;
  }
  #help h3 { margin: 0 0 12px; }
  #help table { border-collapse: collapse; font-size: 12.5px; }
  #help td { padding: 3px 14px 3px 0; color: var(--ink2); }
  #help td:first-child { color: var(--ink); white-space: nowrap; }

  #ed {
    position: absolute; display: none; z-index: 25;
    background: rgba(255,255,255,.9); border: 1.5px dashed var(--sel);
    outline: none; resize: none; overflow: hidden;
    line-height: 1.3; padding: 0; margin: 0;
  }
  [data-theme="dark"] #ed { background: rgba(30,30,34,.9); }

  #cv { position: fixed; inset: 0; display: block; }
  body.zen .chrome { display: none !important; }
  #fileIn, #imgIn { display: none; }

  #cpick {
    position: fixed; z-index: 60; width: 228px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--isl-shadow); padding: 12px;
    display: none; flex-direction: column; gap: 10px;
  }
  #cpick.open { display: flex; }

  #bdlg {
    position: fixed; z-index: 60; width: 268px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--isl-shadow); padding: 14px;
    display: none; flex-direction: column; gap: 10px;
  }
  #bdlg.open { display: flex; }
  #bdlg h5 { margin: 0; font-size: 13px; font-weight: 600; }
  #bdlg .brow { display: flex; gap: 4px; }
  #bdlg input[type="text"] {
    flex: 1; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--ink); padding: 7px 10px;
    font: 13px 'Segoe UI', system-ui, sans-serif; outline: none; min-width: 0;
  }
  #bdlg .blist { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
  #bdlg .bitem {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
  }
  #bdlg .bitem .bmeta { flex: 1; min-width: 0; }
  #bdlg .bitem .bname { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bdlg .bitem .bsub { font-size: 11px; color: var(--ink2); }
  #bdlg .bitem button { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
  #bdlg .bempty { font-size: 12px; color: var(--ink2); text-align: center; padding: 10px 0; }
  #bdlg .bhint { font-size: 11px; color: var(--ink2); }
  #cpick h5 { margin: 2px 0 0; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
  .cgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .cgrid button {
    width: 100%; aspect-ratio: 1; border-radius: 6px;
    border: 1px solid var(--line); padding: 0; min-width: 0;
  }
  .cgrid button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chex { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .chex span { color: var(--ink2); font: 13px Consolas, monospace; }
  .chex input {
    border: none; outline: none; background: transparent; color: var(--ink);
    font: 13px Consolas, monospace; width: 100%; text-transform: lowercase;
  }
  .cprev { width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--line); }

  #agentchip {
    position: fixed; top: 12px; right: 12px; z-index: 25;
    font-size: 12px; color: var(--accent); font-weight: 600;
    background: var(--bar); border: 1px solid var(--accent); border-radius: 99px;
    padding: 5px 14px; box-shadow: var(--isl-shadow);
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #agentchip.show { opacity: .95; }

  #searchbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 31;
    display: none; align-items: center; gap: 8px; padding: 4px 10px;
  }
  #searchbar.open { display: flex; }
  #searchbar input {
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink);
    padding: 6px 10px; font: 13px 'Segoe UI', system-ui, sans-serif; outline: none; width: 220px;
  }
  #searchInfo { font-size: 11px; color: var(--ink2); min-width: 44px; }

  #presentbar {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 31;
    display: none; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; font-size: 12px; color: var(--ink2);
  }
  #presentbar.open { display: flex; }
  #presentbar button { padding: 5px 12px; border-radius: 8px; background: var(--accent2); color: var(--accent); font-weight: 600; }
  body.present .chrome { display: none !important; }
  body.present #presentbar { display: flex; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="isl chrome" id="menuBtn" title="Menu"></button>
<div class="isl chrome" id="tb"></div>
<div id="hint" class="chrome"></div>
<div id="panel"></div>
<div class="isl chrome" id="bl"></div>
<button class="isl chrome" id="helpBtn" title="Ajuda (?)"></button>
<div class="isl chrome" id="br"><span><span id="live"></span><span id="livetxt">conectando…</span></span><span id="save">—</span></div>
<div id="menu"></div>
<div id="cpick"></div>
<div id="bdlg"></div>
<div id="agentchip" class="chrome"></div>
<div id="searchbar" class="chrome isl"><input id="searchIn" type="text" spellcheck="false"><span id="searchInfo"></span></div>
<div id="presentbar" class="isl"><span id="presentHint"></span><button id="presentExit"></button></div>
<div id="help"><div class="card"><h3>Atalhos</h3><div id="helpBody"></div></div></div>
<textarea id="ed" spellcheck="false"></textarea>
<input type="file" id="fileIn" accept=".drawrdis,.json,.excalidraw,application/json">
<input type="file" id="imgIn" accept="image/*" multiple>
<pre id="testout" style="position:fixed;left:8px;top:90px;z-index:99;background:#fff;color:#000;font:12px Consolas;max-width:50vw;display:none;white-space:pre-wrap"></pre>

<script>
'use strict';
const FONT_HAND = "'Segoe Print', 'Comic Sans MS', cursive";
const FONT_NORMAL = "'Segoe UI', system-ui, sans-serif";
const FONT_CODE = "Consolas, 'Cascadia Code', monospace";
const fontOf = f => f === 'hand' ? FONT_HAND : f === 'code' ? FONT_CODE : FONT_NORMAL;
const INK = '#1b1b1f';
const snapMode = new URLSearchParams(location.search).has('snap');

/* ---------- idioma ---------- */
// O português é a fonte da verdade; EN só sobrepõe o chrome (menu, barras,
// painéis, diálogos). Dicas dinâmicas do canvas ainda são PT.
let lang = localStorage.getItem('drawrdis-lang') || 'pt';
const EN = {
  menuOpen: 'Open file…', menuSave: 'Save .drawrdis file…', menuNew: 'New board…',
  menuBoards: 'Saved boards…', menuPng: 'Export PNG', menuSvg: 'Export SVG',
  menuExcali: 'Export Excalidraw', menuPresent: 'Present mode', menuHistory: 'History…',
  menuUnlock: 'Unlock all', menuGrid: 'Magnetic grid', menuZen: 'Zen mode',
  menuBg: 'Background', menuClear: 'Clear board', menuLang: 'Português',
  themeDark: 'Dark theme', themeLight: 'Light theme',
  presentHint: 'click an element with a link to navigate · Esc to exit', presentExit: 'Exit',
  histTitle: 'Automatic history',
  histHint: 'A snapshot every 20 versions and before full replaces. Restoring swaps the current board (Ctrl+Z goes back).',
  histEmpty: 'no snapshots yet', histRestore: 'Restore', noServer: 'no connection to the server',
  boardsTitle: 'Saved boards', boardsPh: 'board name…', boardsSave: 'Save', boardsOpen: 'Open',
  boardsHint: 'Opening replaces the current board (Ctrl+Z goes back). The current board keeps auto-saving while you draw.',
  boardsEmpty: 'no saved boards yet',
  searchPh: 'search text…',
  saving: 'saving…', saved: 'saved', saveError: 'error saving',
  connecting: 'connecting…', live: 'live', reconnecting: 'reconnecting…',
  panelStyle: 'Style', panelStroke: 'Stroke', panelFill: 'Background', panelWidth: 'Stroke width',
  panelStrokeStyle: 'Stroke style', panelRough: 'Hand-drawn', panelCorners: 'Corners', panelFont: 'Font',
  panelTextAlign: 'Text alignment', panelOpacity: 'Opacity', panelLayers: 'Layers', panelAlign: 'Align',
  panelActions: 'Actions',
  toolHand: 'Hand', toolSelect: 'Select', toolRect: 'Rectangle', toolDiamond: 'Diamond', toolEllipse: 'Ellipse',
  toolArrow: 'Arrow', toolLine: 'Line', toolDraw: 'Pencil', toolText: 'Text', toolImage: 'Image', toolErase: 'Eraser',
  toolLock: 'Lock tool (Q)', widgets: 'UI widgets', undo: 'Undo (Ctrl+Z)', redo: 'Redo (Ctrl+Y)',
  zoomOut: 'Zoom out (-)', zoomIn: 'Zoom in (+)', zoomFit: 'Fit all (Shift+1)', zoomReset: 'Back to 100%',
  help: 'Help (?)', menu: 'Menu',
  bgDots: 'Dots', bgGrid: 'Grid', bgLines: 'Lines', bgPlain: 'Plain', bgColor: 'Background color',
  agentEdited: n => n === 1 ? 'the agent edited 1 item' : `the agent edited ${n} items`,
};
function t(key, pt) { return lang === 'en' && EN[key] !== undefined ? EN[key] : pt; }

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const ed = document.getElementById('ed');
const liveEl = document.getElementById('live');
const livetxt = document.getElementById('livetxt');
const saveEl = document.getElementById('save');
const hintEl = document.getElementById('hint');
const panelEl = document.getElementById('panel');
const menuEl = document.getElementById('menu');
const fileIn = document.getElementById('fileIn');
const imgIn = document.getElementById('imgIn');
const agentChip = document.getElementById('agentchip');
const searchbar = document.getElementById('searchbar');
const searchIn = document.getElementById('searchIn');
const searchInfo = document.getElementById('searchInfo');
const presentbar = document.getElementById('presentbar');

let scene = { version: 1, title: 'Drawrdis', bg: null, items: [] };
let z = 1, panX = 60, panY = 80;
let W = 0, H = 0, dpr = 1;

let tool = 'select';
let lockTool = false;
let stampMode = null;
let selIds = [];
let hoverId = null;
let bindHover = null;
let mode = null;           // pan|move|resize|rotate|create|marquee
let spaceDown = false;
let editingId = null;
let gesture = {}, gestureSnap = null;
let marquee = null;
let marqueeCands = [];
let clip = [];
let undoStack = [], redoStack = [];
let dirty = false, stale = false;
let snapOn = false;
let zen = false;
let present = false;          // modo apresentação: sem chrome, clique segue links
let linkFrom = null;          // id aguardando destino de link (tecla L)
const flashMap = new Map();   // id -> timestamp de um item recém-editado pelo agente
let flashRaf = 0;
const imgCache = new Map();

const cur = {
  stroke: INK, fill: 'transparent', fillStyle: 'hachure', strokeWidth: 2,
  strokeStyle: 'solid', roughness: 1, opacity: 100, r: 8,
  fontSize: 20, fontFamily: 'hand', bold: false, textAlign: 'left',
};

/* ---------- câmera ---------- */
const s2wX = sx => (sx - panX) / z;
const s2wY = sy => (sy - panY) / z;
const w2sX = wx => wx * z + panX;
const w2sY = wy => wy * z + panY;
const uid = () => crypto.randomUUID().slice(0, 12);
const S = v => snapOn ? Math.round(v / 20) * 20 : v;

/* ---------- utilitários ---------- */
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  if (g.beginPath) g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function centerOf(it) {
  const b = itemBox(it);
  return { x: b.bx + b.w / 2, y: b.by + b.h / 2 };
}
function rot(px, py, cx, cy, a) {
  const dx = px - cx, dy = py - cy, c = Math.cos(a), s = Math.sin(a);
  return [cx + dx * c - dy * s, cy + dx * s + dy * c];
}
function dashOf(it) {
  if (it.strokeStyle === 'dashed') return [10, 8];
  if (it.strokeStyle === 'dotted') return [1.5, 6];
  return [];
}

/* ---------- geometria de itens ---------- */
function wrapLines(paras, maxW) {
  const out = [];
  for (const para of paras) {
    if (!para) { out.push(''); continue; }
    const words = para.split(' ');
    let line = '';
    for (const wd of words) {
      const cand = line ? line + ' ' + wd : wd;
      if (ctx.measureText(cand).width <= maxW || !line) {
        if (!line && ctx.measureText(wd).width > maxW) {
          let chunk = '';
          for (const ch of wd) {
            if (chunk && ctx.measureText(chunk + ch).width > maxW) { out.push(chunk); chunk = ch; }
            else chunk += ch;
          }
          line = chunk;
          continue;
        }
        line = cand;
      } else {
        out.push(line);
        line = wd;
      }
    }
    out.push(line);
  }
  return out;
}
function ensureTextSize(it) {
  // Guard: fontSize must be a finite positive number; default to 14 if missing/invalid
  const fs = Number(it.fontSize);
  if (!isFinite(fs) || fs <= 0) it.fontSize = 14;
  // cache de layout: measureText é caro; só refaz se texto/fonte/largura mudarem
  const sig = [it.text, it.fontSize, it.bold ? 1 : 0, it.fontFamily, it.autoW ? 'a' : (it.w || 0)].join('|');
  if (it._tsig === sig && it._lines) return;
  it._tsig = sig;
  ctx.font = (it.bold ? '700 ' : '400 ') + it.fontSize + 'px ' + fontOf(it.fontFamily);
  const paras = String(it.text ?? '').split('\n');
  if (it.autoW || !it.w) {
    let w = 10;
    for (const ln of paras) w = Math.max(w, ctx.measureText(ln).width);
    it.w = Math.ceil(w) + 2;
  }
  const lines = wrapLines(paras, it.w);
  it.h = Math.ceil(lines.length * it.fontSize * 1.3);
  it._lines = lines;
}
function textBox(it) {
  ensureTextSize(it);
  return { bx: it.align === 'center' ? it.x - it.w / 2 : it.x, by: it.y, w: it.w, h: it.h };
}
function drawBox(it) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of it.points) {
    x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]);
    x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
  }
  return { bx: x0 - 6, by: y0 - 6, w: x1 - x0 + 12, h: y1 - y0 + 12 };

        ctx.arc(w2sX(b.bx + b.w) - 7, w2sY(b.by) + 7, 4, 0, Math.PI * 2);

/* ---------- histórico ---------- */
// Entradas de undo são de dois tipos:
//   { f: '<json de todos os items>' }  → comandos que adicionam/removem itens
//   { p: { b, a, ids } }               → gestos de transformação (move/resize/
//                                         rotate/bend): guardam só os itens tocados.

// da pilha em boards grandes.
function subsetSnap(ids) {

  return out;
}

// escreveu no meio do caminho (itens fora de m não são tocados).

    for (const id of ord) { const it = byId.get(id); if (it) { out.push(it); seen.add(id); } }
    for (const it of byId.values()) if (!seen.has(it.id)) out.push(it);
    scene.items = out;
  } else {
    const out = [];
    for (const it of scene.items) {

  else {

    applyOpMap(JSON.parse(e.p.b), e.p.ordB);

  else {

/* ---------- agrupar / desagrupar ---------- */
// Um grupo é um conjunto de itens que compartilham o mesmo campo `g` (id do

    if (!it) continue;

    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);

  if (!gs.size) return ids.slice();

  for (const id of selIds) { const it = scene.items.find(i => i.id === id); if (it) it.g = gid; }

  if (!ids.length) return;
  const set = new Set(ids);
  const affected = scene.items
    .filter(i => !set.has(i.id) && ((i.startBind && set.has(i.startBind.id)) || (i.endBind && set.has(i.endBind.id))))
    .map(i => i.id);

/* ---------- salvar / sincronizar ---------- */
// O editor não substitui a cena inteira: manda um diff por item
// (add/update/remove/order) e o servidor aplica sobre o estado atual.
// Itens que o agente escreveu no meio do caminho sobrevivem ao nosso save.
let saveTimer = null;

  baseStr = new Map(s.items.map(i => [i.id, JSON.stringify(i)]));

    for (const it of scene.items) {
      seen.add(it.id);
      const b = baseStr.get(it.id);
      if (b === undefined) { it.by = 'user'; add.push(it); sent.push([it.id, JSON.stringify(it)]); }
      else {
        const j = JSON.stringify(it);
        if (b !== j) { it.by = 'user'; update.push(it); sent.push([it.id, JSON.stringify(it)]); }
      }
    }
    const remove = [];
    for (const id of baseStr.keys()) if (!seen.has(id)) remove.push(id);
    if (add.length || update.length || remove.length) {
      const res = await fetch('/sync', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ rev: lastRev, add, update, remove, order: scene.items.map(i => i.id) }),
      });
      if (!res.ok) throw new Error((await res.text()).slice(0, 120));
      const r = await res.json();
      for (const [id, j] of sent) baseStr.set(id, j);
      for (const id of remove) baseStr.delete(id);
      lastRev = r.rev || lastRev;
    }
    dirty = false;
    setStatus(t('saved', 'salvo') + ' ' + new Date().toLocaleTimeString());
    if (stale && !busy()) {
      stale = false;
      try {
        const s = await (await fetch('/scene')).json();
        if (!busy()) applyIncoming(s);
      } catch { /* próxima gravação reconcilia */ }
    }

// Re-encode via canvas to WebP (mantém o board leve); cai para JPEG se o
// navegador não suportar WebP no toDataURL. Redimensiona para caber em maxDim.
function encodeImage(img, maxDim) {
  const w0 = img.naturalWidth || 1, h0 = img.naturalHeight || 1;
  const sc = Math.min(1, maxDim / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  off.getContext('2d').drawImage(img, 0, 0, w, h);
  let src = off.toDataURL('image/webp', 0.85);
  if (!src.startsWith('data:image/webp')) src = off.toDataURL('image/jpeg', 0.85);
  return { src, w, h };
}
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => resolve(encodeImage(im, 1400));
      im.onerror = () => reject(new Error('imagem inválida'));
      im.src = rd.result;
    };
    rd.onerror = () => reject(new Error('leitura falhou'));
    rd.readAsDataURL(file);
  });
}
// Manda o dataURL para o servidor guardar em files/<hash> e devolve a URL.

async function externalizeImage(dataUrl) {
  try {
    const r = await fetch('/img', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ data: dataUrl }),
    });
    if (r.ok) return (await r.json()).src;
  } catch { /* sem servidor: o dataURL entra no quadro mesmo assim */ }

}
// Insere N imagens de uma vez, em grade, re-encodadas em WebP e externalizadas.
async function addImageFiles(files, at) {
  const imgs = Array.from(files || []).filter(f => f && f.type && f.type.startsWith('image/'));
  if (!imgs.length) return;
  const decoded = [];
  for (const f of imgs) {
    try { decoded.push(await loadImageFile(f)); } catch { /* pula a que falhar */ }
  }
  if (!decoded.length) { setHint('não consegui ler essas imagens'); return; }
  for (const d of decoded) d.src = await externalizeImage(d.src);

  const cols = Math.ceil(Math.sqrt(decoded.length));
  const rows = Math.ceil(decoded.length / cols);
  const baseX = at ? at[0] : s2wX(W / 2) - (cols * cell + (cols - 1) * gap) / 2;
  const baseY = at ? at[1] : s2wY(H / 2) - (rows * cell + (rows - 1) * gap) / 2;
  const newIds = [];
  const ord0 = orderIds();
  decoded.forEach((d, i) => {
    const scale = cell / Math.max(d.w, d.h);
    const w = d.w * scale, h = d.h * scale;
    const col = i % cols, row = Math.floor(i / cols);
    const cx = baseX + col * (cell + gap), cy = baseY + row * (cell + gap);
    const it = { id: uid(), type: 'image', src: d.src, x: cx + (cell - w) / 2, y: cy + (cell - h) / 2, w, h, angle: 0, opacity: 100 };
    scene.items.push(it); newIds.push(it.id);
  });
  pushOp(nullMap(newIds), subsetSnap(newIds), newIds, ord0, orderIds());
  selIds = newIds;
  setTool('select');
  save(); draw(); refreshPanel();
  setHint(newIds.length + (newIds.length > 1 ? ' imagens inseridas (webp)' : ' imagem inserida (webp)'));
}

    const corners = [[gb.x, gb.y], [gb.x + gb.w, gb.y], [gb.x + gb.w, gb.y + gb.h], [gb.x, gb.y + gb.h]];
    for (let i = 0; i < 4; i++) {
      if (Math.abs(sx - w2sX(corners[i][0])) <= 7 && Math.abs(sy - w2sY(corners[i][1])) <= 7) return ['nw', 'ne', 'se', 'sw'][i];
    }
    return null;
  }
  if (selIds.length !== 1) return null;
  const it = scene.items.find(i => i.id === selIds[0]);
  if (!it) return null;
  if (it.type === 'line' || it.type === 'arrow') {
    const cp = curvePts(it);
    for (let i = 0; i < cp.length; i++) {

  if (!['rect', 'ellipse', 'diamond', 'image', 'draw', 'text'].includes(it.type)) return null;
  const pts = rotCorners(it).map(p => [w2sX(p[0]), w2sY(p[1])]);
  for (let i = 0; i < 4; i++) {
    if (Math.abs(sx - pts[i][0]) <= 7 && Math.abs(sy - pts[i][1]) <= 7) return ['nw', 'ne', 'se', 'sw'][i];
  }
  const [rmx, rmy] = rotHandleScreen(it);

      const st = gesture.starts[id];
      if (!it || !st) continue;
      if (it.type === 'draw') { it.points = st.pts.map(p => [p[0] + dx, p[1] + dy]); continue; }
      it.x = st.x + dx; it.y = st.y + dy;
      if (it.type === 'line' || it.type === 'arrow') {
        it.x2 = st.x2 + dx; it.y2 = st.y2 + dy;
        if (st.mids && it.mids) it.mids = st.mids.map(m => [m[0] + dx, m[1] + dy]);
      }
    }
    draw();
    return;
  }
  if (mode === 'rotate') {
    let ang = gesture.a0 + (Math.atan2(wy - gesture.c0.y, wx - gesture.c0.x) - gesture.pa);
    if (e.shiftKey) ang = Math.round(ang / (Math.PI / 12)) * (Math.PI / 12);
    if (Math.abs(ang - gesture.a0) > 0.001) gesture.rotated = true;
    for (const id of selIds) {
      const it = scene.items.find(i => i.id === id);
      if (!it) continue;
      const o = gesture.orig;
      if (it.type === 'draw') {
        it.points = o.pts.map(p => rot(p[0], p[1], gesture.c0.x, gesture.c0.y, ang));
      } else if (it.type === 'line' || it.type === 'arrow') {
        const [nx, ny] = rot(o.x, o.y, gesture.c0.x, gesture.c0.y, ang);
        const [nx2, ny2] = rot(o.x2, o.y2, gesture.c0.x, gesture.c0.y, ang);
        it.x = nx; it.y = ny; it.x2 = nx2; it.y2 = ny2;
        if (o.mids) it.mids = o.mids.map(m => rot(m[0], m[1], gesture.c0.x, gesture.c0.y, ang));
      } else {
        it.angle = ang;
      }
    }
    setHint(Math.round(ang * 180 / Math.PI) + '°');
    draw();
    return;
  }
  if (mode === 'resize') {
    if (gesture.group) {
      const g0 = gesture.gbox0;
      if (!g0 || g0.w <= 0 || g0.h <= 0) return;
      const { corner } = gesture;
      let x = g0.x, y = g0.y, w = g0.w, h = g0.h;
      if (corner.includes('e')) w = wx - x;
      if (corner.includes('s')) h = wy - y;
      if (corner.includes('w')) { w = g0.x + g0.w - wx; x = wx; }
      if (corner.includes('n')) { h = g0.y + g0.h - wy; y = wy; }
      w = Math.max(10, w); h = Math.max(10, h);
      if (e.shiftKey) {
        const s = Math.max(w / g0.w, h / g0.h);
        w = g0.w * s; h = g0.h * s;
        if (corner.includes('w')) x = g0.x + g0.w - w;
        if (corner.includes('n')) y = g0.y + g0.h - h;
      }
      const sx = w / g0.w, sy = h / g0.h;
      for (const id of selIds) {
        const it = scene.items.find(i => i.id === id); const o = gesture.origs[id];
        if (!it || !o) continue;
        it.x = x + (o.x - g0.x) * sx; it.y = y + (o.y - g0.y) * sy;
        if (Number.isFinite(o.w)) it.w = o.w * sx;
        if (Number.isFinite(o.h)) it.h = o.h * sy;
        if (Number.isFinite(o.x2)) it.x2 = x + (o.x2 - g0.x) * sx;
        if (Number.isFinite(o.y2)) it.y2 = y + (o.y2 - g0.y) * sy;
        if (o.pts) it.points = o.pts.map(p => [x + (p[0] - g0.x) * sx, y + (p[1] - g0.y) * sy]);
        if (o.mids) it.mids = o.mids.map(m => [x + (m[0] - g0.x) * sx, y + (m[1] - g0.y) * sy]);
        if (it.type === 'text' && Number.isFinite(o.fontSize)) { it.fontSize = Math.max(4, Math.round(o.fontSize * (sx + sy) / 2 * 4) / 4); ensureTextSize(it); }
      }
      draw();
      return;
    }
    const it = scene.items.find(i => i.id === selIds[0]);
    if (!it) return;
    const { corner } = gesture;
    if (it.angle) {
      const inv = -gesture.a;
      const lp = rot(wx, wy, gesture.c0.x, gesture.c0.y, inv);
      const dxc = lp[0] - gesture.c0.x, dyc = lp[1] - gesture.c0.y;
      let x0, x1, y0, y1, nw, nh;
      if (e.ctrlKey) {
        nw = Math.max(24, 2 * Math.abs(dxc));
        nh = Math.max(24, 2 * Math.abs(dyc));
        if (e.shiftKey && gesture.ow > 0 && gesture.oh > 0) {
          const ratio = gesture.ow / gesture.oh;
          if (Math.abs(nw - gesture.ow) / gesture.ow > Math.abs(nh - gesture.oh) / gesture.oh) nh = nw / ratio;
          else nw = nh * ratio;
        }
        x0 = -nw / 2; x1 = nw / 2; y0 = -nh / 2; y1 = nh / 2;
      } else {
        const axr = corner.includes('w') ? gesture.ow / 2 : -gesture.ow / 2;
        const ayr = corner.includes('n') ? gesture.oh / 2 : -gesture.oh / 2;
        x0 = Math.min(axr, dxc); x1 = Math.max(axr, dxc);
        y0 = Math.min(ayr, dyc); y1 = Math.max(ayr, dyc);
        if (x1 - x0 < 12) { if (corner.includes('w')) x0 = x1 - 12; else x1 = x0 + 12; }
        if (y1 - y0 < 12) { if (corner.includes('n')) y0 = y1 - 12; else y1 = y0 + 12; }
        nw = x1 - x0; nh = y1 - y0;
        if (e.shiftKey && gesture.ow > 0 && gesture.oh > 0) {
          const ratio = gesture.ow / gesture.oh;
          if (Math.abs(nw - gesture.ow) / gesture.ow > Math.abs(nh - gesture.oh) / gesture.oh) nh = nw / ratio;
          else nw = nh * ratio;
          if (corner.includes('w')) x0 = x1 - nw; else x1 = x0 + nw;
          if (corner.includes('n')) y0 = y1 - nh; else y1 = y0 + nh;
        }
      }
      const cxr = (x0 + x1) / 2, cyr = (y0 + y1) / 2;
      const nc = rot(gesture.c0.x + cxr, gesture.c0.y + cyr, gesture.c0.x, gesture.c0.y, gesture.a);
      it.w = nw; it.h = nh;
      if (it.type === 'text') {
        if (e.altKey && gesture.gbox.w > 0 && gesture.font0) {
          const f = Math.max(0.05, nw / gesture.gbox.w);
          it.fontSize = Math.max(4, Math.round(gesture.font0 * f * 2) / 2);
          it.autoW = false;
        }
        ensureTextSize(it);
        if (it.align === 'center') it.x = nc[0];
        else it.x = nc[0] - nw / 2;
        it.y = nc[1] - nh / 2;
      } else {
        it.x = nc[0] - nw / 2; it.y = nc[1] - nh / 2;
      }
      draw();
      return;
    }
    if (it.type === 'text') {
      const gb = gesture.gbox;
      let newW = gb.w;
      if (corner.includes('e')) newW = wx - gb.x;
      if (corner.includes('w')) newW = gb.x + gb.w - wx;
      newW = Math.max(24, newW);
      if (it.align === 'center') {
        if (corner.includes('e')) it.x = gb.x + newW / 2;
        else if (corner.includes('w')) it.x = gb.x + gb.w - newW / 2;
      } else if (corner.includes('w')) {
        it.x = gb.x + gb.w - newW;
      }
      it.w = newW;
      it.autoW = false;
      if (e.altKey && gb.w > 0 && gesture.font0) {
        const f = Math.max(0.05, newW / gb.w);
        it.fontSize = Math.max(4, Math.round(gesture.font0 * f * 2) / 2);
      }
      ensureTextSize(it);
      draw();
      return;
    }
    const o = gesture.orig;
    let { x, y, w, h } = o;
    if (corner.includes('e')) w = wx - o.x;
    if (corner.includes('s')) h = wy - o.y;
    if (corner.includes('w')) { w = o.x + o.w - wx; x = wx; }
    if (corner.includes('n')) { h = o.y + o.h - wy; y = wy; }
    if (w < 12) { if (corner.includes('w')) x = o.x + o.w - 12; w = 12; }
    if (h < 12) { if (corner.includes('n')) y = o.y + o.h - 12; h = 12; }
    if (e.shiftKey && o.w > 0 && o.h > 0) {
      const ratio = o.w / o.h;
      if (Math.abs(w - o.w) / o.w > Math.abs(h - o.h) / o.h) h = w / ratio;
      else w = h * ratio;
      if (corner.includes('w')) x = o.x + o.w - w;
      if (corner.includes('n')) y = o.y + o.h - h;
      if (w < 12) { w = 12; h = 12 / ratio; if (corner.includes('w')) x = o.x + o.w - 12; if (corner.includes('n')) y = o.y + o.h - h; }
      if (h < 12) { h = 12; w = 12 * ratio; if (corner.includes('n')) y = o.y + o.h - 12; if (corner.includes('w')) x = o.x + o.w - w; }
    }
    if (e.ctrlKey) {
      x = o.x + (o.w - w) / 2;
      y = o.y + (o.h - h) / 2;
    }
    if (it.type === 'draw') {
      if (gesture.orig?.pts) {
        const iw = o.w - 12, ih = o.h - 12;
        const sxr = iw > 0 ? (w - 12) / iw : 1, syr = ih > 0 ? (h - 12) / ih : 1;
        it.points = gesture.orig.pts.map(p => [
          x + 6 + (p[0] - (o.x + 6)) * sxr,
          y + 6 + (p[1] - (o.y + 6)) * syr,
        ]);
      }
    } else {
      it.x = x; it.y = y; it.w = w; it.h = h;
    }
    draw();
    return;
  }
  if (mode === 'create') {
    const it = gesture.item;
    if (it.type === 'line' || it.type === 'arrow') {
      let dx = wx - gesture.sx, dy = wy - gesture.sy;
      if (e.shiftKey) {
        const len = Math.hypot(dx, dy);
        const aA = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
        dx = len * Math.cos(aA); dy = len * Math.sin(aA);
      }
      it.x2 = gesture.sx + dx; it.y2 = gesture.sy + dy;
    } else if (it.type === 'draw') {
      const last = it.points[it.points.length - 1];
      if (Math.hypot(wx - last[0], wy - last[1]) > 2.5 / z) it.points.push([wx, wy]);
    } else {
      let dx = S(wx) - gesture.sx, dy = S(wy) - gesture.sy;
      if (e.shiftKey) {
        const s2 = Math.max(Math.abs(dx), Math.abs(dy));
        dx = Math.sign(dx || 1) * s2; dy = Math.sign(dy || 1) * s2;
      }
      it.x = Math.min(gesture.sx, gesture.sx + dx); it.y = Math.min(gesture.sy, gesture.sy + dy);
      it.w = Math.abs(dx); it.h = Math.abs(dy);
    }
    draw();
  }
});

cv.addEventListener('pointerup', e => {
  if (mode === 'create') {
    const it = gesture.item;
    let tiny = false;
    if (it.type === 'line' || it.type === 'arrow') tiny = Math.hypot(it.x2 - it.x, it.y2 - it.y) < 5;
    else if (it.type === 'draw') {
      const b = drawBox(it);
      tiny = it.points.length < 2 || (b.w < 10 && b.h < 10);
    } else tiny = it.w < 4 && it.h < 4;
    if (tiny) {
      scene.items = scene.items.filter(i => i.id !== it.id);
    } else {
      selIds = [it.id];
      if (it.type === 'arrow' || it.type === 'line') {
        const t1 = bindTargetAt(it.x, it.y, it);
        if (t1) it.startBind = e.altKey ? { id: t1.id, ...relPoint(t1, it.x, it.y) } : { id: t1.id };
        const t2 = bindTargetAt(it.x2, it.y2, it);
        if (t2) it.endBind = e.altKey ? { id: t2.id, ...relPoint(t2, it.x2, it.y2) } : { id: t2.id };
      }
      pushOp(nullMap([it.id]), subsetSnap([it.id]), [it.id], gesture.ord0, orderIds());
      save();
      if (!lockTool) { setTool('select'); refreshPanel(); }
    }
  } else if (mode === 'bend') {
    const [sx, sy] = canvasPos(e);
    const d = Math.hypot(s2wX(sx) - gesture.startWx, s2wY(sy) - gesture.startWy);
    const bit = gesture.bendIt;
    if (d < 0.5 && gesture.inserted) {
      if (bit.mids) {
        bit.mids.splice(gesture.bendIdx - 1, 1);
        if (!bit.mids.length) delete bit.mids;
      }
    }
    if (d < 0.5 && gesture.unbound && bit) {
      bit[gesture.unbound.key] = gesture.unbound.val;
    } else if (d >= 0.5 && bit && (bit.type === 'arrow' || bit.type === 'line')) {
      const cpU = curvePts(bit);
      if (gesture.bendIdx === 0) {
        const t = bindTargetAt(bit.x, bit.y, bit);
        if (t) bit.startBind = e.altKey ? { id: t.id, ...relPoint(t, bit.x, bit.y) } : { id: t.id };
      } else if (gesture.bendIdx === cpU.length - 1) {
        const t = bindTargetAt(bit.x2, bit.y2, bit);
        if (t) bit.endBind = e.altKey ? { id: t.id, ...relPoint(t, bit.x2, bit.y2) } : { id: t.id };
      }
    }
    if (d >= 0.5) {
      pushPatch(gesture.before, subsetSnap(gesture.patchIds), gesture.patchIds);
      save();
    }
    bindHover = null;
  } else if (mode === 'move' || mode === 'resize' || mode === 'rotate') {
    const [sx, sy] = canvasPos(e);
    const d = gesture.startWx === undefined ? 1
      : Math.hypot(s2wX(sx) - gesture.startWx, s2wY(sy) - gesture.startWy);
    if (mode === 'rotate' ? gesture.rotated : d >= 0.5) {
      pushPatch(gesture.before, subsetSnap(gesture.patchIds), gesture.patchIds);
      save();
    }
    if (mode === 'rotate') setHint(null);
  } else if (mode === 'erase') {
    const g = gesture;
    if (g.erased && g.erased.length) {
      const before = {};
      for (const it of g.erased) before[it.id] = it;
      pushOp(before, nullMap(g.erased.map(i => i.id)), g.erased.map(i => i.id), g.ord0, orderIds());
      save();
    }
  } else if (mode === 'marquee') {
    const [sxU, syU] = canvasPos(e);
    const dragged = Math.hypot(sxU - (gesture.sx0 ?? sxU), syU - (gesture.sy0 ?? syU)) >= 8;
    if (dragged) {
      selIds = expandGroup(marqueeCands);
    } else {
      selIds = [];
    }
    marquee = null;
    marqueeCands = [];
    refreshPanel();
  }
  mode = null;
  if (tool === 'hand') cv.style.cursor = 'grab';
  draw();
});

cv.addEventListener('pointercancel', () => {
  if (mode === 'create' && gesture.item) {
    scene.items = scene.items.filter(i => i.id !== gesture.item.id);
  } else if ((mode === 'move' || mode === 'resize' || mode === 'rotate' || mode === 'bend') && gesture.before) {
    applyPatchMap(gesture.before);
    selIds = selIds.filter(id => scene.items.some(i => i.id === id));
  }
  marquee = null;
  marqueeCands = [];
  mode = null;
  setHint(null);
  draw();
});

cv.addEventListener('dblclick', e => {
  const [sx, sy] = canvasPos(e);
  const wx = s2wX(sx), wy = s2wY(sy);
  const it = hitItem(wx, wy);
  if (it && it.type === 'text') {
    gesture = { newText: false, before: subsetSnap([it.id]) };
    openEditor(it, false);
  } else if (!it) {
    const t = mkText('', wx, wy - 10, cur.fontSize);
    t.id = uid();
    t.opacity = cur.opacity;
    const ord0 = orderIds();
    scene.items.push(t);
    gesture = { newText: true, ord0 };
    openEditor(t, true);
  }
});

cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- edição de texto ---------- */
function openEditor(it, isNew) {
  editingId = it.id;
  const b = textBox(it);
  ed.value = it.text;
  ed.style.display = 'block';
  ed.style.left = (w2sX(b.bx) - 2) + 'px';
  ed.style.top = (w2sY(b.by) - 2) + 'px';
  ed.style.fontFamily = fontOf(it.fontFamily);
  ed.style.fontSize = (it.fontSize * z) + 'px';
  ed.style.fontWeight = it.bold ? '700' : '400';
  ed.style.color = it.stroke;
  ed.style.width = Math.max(b.w * z + 20, 120) + 'px';
  ed.style.height = Math.max(b.h * z + 8, it.fontSize * z * 1.5) + 'px';
  ed.focus();
  ed.select();
}
function commitEditor() {
  const id = editingId;
  editingId = null;
  ed.style.display = 'none';
  const it = scene.items.find(i => i.id === id);
  if (!it) return;
  const val = ed.value.replace(/\n+$/, '');
  if (gesture.newText && !val.trim()) {
    scene.items = scene.items.filter(i => i.id !== it.id);
  } else if (val !== it.text) {
    it.text = val;
    ensureTextSize(it);
    if (gesture.newText) pushOp(nullMap([it.id]), subsetSnap([it.id]), [it.id], gesture.ord0, orderIds());
    else pushOp(gesture.before || subsetSnap([it.id]), subsetSnap([it.id]), [it.id]);
    save();
  }
  if (gesture.viaTool && !lockTool) setTool('select');
  setHint(null);
  draw();
}
ed.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitEditor(); }
  if (e.key === 'Escape') { e.preventDefault(); commitEditor(); }
});
ed.addEventListener('blur', () => { if (editingId !== null) commitEditor(); });

/* ---------- área de transferência, ordem, alinhar ---------- */
function copySel() {
  clip = scene.items.filter(i => selIds.includes(i.id)).map(i => JSON.parse(JSON.stringify(i)));
  setHint(clip.length ? 'copiado' : null);
}
function pasteClip() {
  if (!clip.length) return;
  const clones = clip.map(i => {
    const c = JSON.parse(JSON.stringify(i));
    c.id = uid();
    shiftItem(c, 16, 16);
    return c;
  });
  const ord0 = orderIds();
  scene.items.push(...clones);
  const ids = clones.map(c => c.id);
  pushOp(nullMap(ids), Object.fromEntries(clones.map(c => [c.id, c])), ids, ord0, orderIds());
  selIds = ids;
  save(); draw(); refreshPanel();
}
function cutSel() {
  if (!selIds.length) return;
  copySel();
  deleteIds(selIds.slice());
}
function duplicateSel() {
  if (!selIds.length) return;
  copySel();
  clip = clip.map(i => { const c = JSON.parse(JSON.stringify(i)); c.id = uid(); return c; });
  pasteClip();
}
function orderSel(dir) {
  if (!selIds.length) return;
  const ord0 = orderIds();
  const sel = scene.items.filter(i => selIds.includes(i.id));
  const rest = scene.items.filter(i => !selIds.includes(i.id));
  if (dir === 'front') scene.items = [...rest, ...sel];
  else if (dir === 'back') scene.items = [...sel, ...rest];
  else if (dir === 'fwd') {
    for (let i = scene.items.length - 2; i >= 0; i--) {
      if (selIds.includes(scene.items[i].id) && !selIds.includes(scene.items[i + 1].id)) {
        [scene.items[i], scene.items[i + 1]] = [scene.items[i + 1], scene.items[i]];
      }
    }
  } else {
    for (let i = 1; i < scene.items.length; i++) {
      if (selIds.includes(scene.items[i].id) && !selIds.includes(scene.items[i - 1].id)) {
        [scene.items[i], scene.items[i - 1]] = [scene.items[i - 1], scene.items[i]];
      }
    }
  }
  pushOp({}, {}, selIds.slice(), ord0, orderIds());
  save(); draw();
}
function alignSel(dir) {
  if (!selIds.length) return;
  if ((dir === 'distH' || dir === 'distV') && selIds.length < 3) return;
  const before = subsetSnap(selIds);
  const sel = scene.items.filter(i => selIds.includes(i.id));
  if (dir === 'distH' || dir === 'distV') {
    const horiz = dir === 'distH';
    const boxes = sel.map(it => ({ it, b: rotAABB(it) }));
    boxes.sort((a, b2) => horiz ? (a.b.bx + a.b.w / 2) - (b2.b.bx + b2.b.w / 2) : (a.b.by + a.b.h / 2) - (b2.b.by + b2.b.h / 2));
    const first = boxes[0].b, last = boxes[boxes.length - 1].b;
    const c0 = horiz ? first.bx + first.w / 2 : first.by + first.h / 2;
    const c1 = horiz ? last.bx + last.w / 2 : last.by + last.h / 2;
    const step = (c1 - c0) / (boxes.length - 1);
    boxes.forEach((e, i) => {
      const b = e.b;
      const target = c0 + step * i;
      const cur2 = horiz ? b.bx + b.w / 2 : b.by + b.h / 2;
      shiftItem(e.it, horiz ? target - cur2 : 0, horiz ? 0 : target - cur2);
    });
  } else {
    let box;
    if (sel.length === 1) {
      box = { bx: s2wX(0), by: s2wY(0), w: W / z, h: H / z };
    } else {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const it of sel) {
        const b = rotAABB(it);
        x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
        x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
      }
      box = { bx: x0, by: y0, w: x1 - x0, h: y1 - y0 };
    }
    for (const it of sel) {
      const b = rotAABB(it);
      let dx = 0, dy = 0;
      if (dir === 'left') dx = box.bx - b.bx;
      if (dir === 'hcenter') dx = box.bx + box.w / 2 - (b.bx + b.w / 2);
      if (dir === 'right') dx = box.bx + box.w - (b.bx + b.w);
      if (dir === 'top') dy = box.by - b.by;
      if (dir === 'vcenter') dy = box.by + box.h / 2 - (b.by + b.h / 2);
      if (dir === 'bottom') dy = box.by + box.h - (b.by + b.h);
      shiftItem(it, dx, dy);
    }
  }
  pushPatch(before, subsetSnap(selIds), selIds);
  save(); draw();
}

/* ---------- teclado ---------- */
window.addEventListener('keydown', e => {
  if (e.target === ed || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  const mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }

/* ---------- colar: imagem, JSON de outro quadro ou interno ---------- */
function importForeignClipboard(ex) {
  if (!looksForeign(ex)) return false;
  const conv = fromForeign(ex);
  if (!conv.items.length) return false;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of conv.items) {
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  const cx = s2wX(W / 2) - (x0 + x1) / 2, cy = s2wY(H / 2) - (y0 + y1) / 2;
  const ord0 = orderIds();
  for (const it of conv.items) {
    it.id = uid();
    shiftItem(it, cx, cy);
    scene.items.push(it);
  }
  const ids = conv.items.map(i => i.id);
  pushOp(nullMap(ids), subsetSnap(ids), ids, ord0, orderIds());
  selIds = ids;
  setTool('select');
  save(); draw(); refreshPanel();
  setHint('colado de outro quadro: ' + conv.items.length + ' itens');
  return true;
}
document.addEventListener('paste', e => {
  if (e.target === ed) return;
  const cd = e.clipboardData;
  const tryForeign = raw => {
    if (!raw || !raw.includes('"elements"')) return false;
    try { return importForeignClipboard(JSON.parse(raw)); } catch { return false; }
  };
  if (cd) {
    const foreignJson = cd.getData('application/vnd.excalidraw+json') || '';
    if (tryForeign(foreignJson)) { e.preventDefault(); return; }
    const txt = cd.getData('text/plain') || '';
    if (tryForeign(txt)) { e.preventDefault(); return; }
    // imagens do clipboard (colado de outra aba/app): pega todas, não só a primeira
    const pasted = [];
    for (const f of cd.files || []) if (f.type.startsWith('image/')) pasted.push(f);
    for (const item of cd.items || []) {
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        const f = item.getAsFile();
        if (f && !pasted.includes(f)) pasted.push(f);

  }
});
cv.addEventListener('dragover', e => e.preventDefault());
cv.addEventListener('drop', e => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer?.files || []);
  if (!files.length) return;
  const [sx, sy] = canvasPos(e);
  const images = files.filter(f => f.type && f.type.startsWith('image/'));
  if (images.length) { addImageFiles(images, [s2wX(sx), s2wY(sy)]); return; }
  const board = files.find(f => f.name.endsWith('.drawrdis') || f.name.endsWith('.excalidraw') || f.name.endsWith('.json') || f.type === 'application/json');
  if (board) loadFileObject(board);
});

/* ---------- roda / zoom ---------- */
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const [sx, sy] = canvasPos(e);
  if (e.ctrlKey || e.metaKey) {
    zoomAt(sx, sy, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  } else {
    panX -= e.deltaX;
    panY -= e.deltaY;
    draw();
  }
}, { passive: false });

function zoomAt(sx, sy, f) {
  const wx = s2wX(sx), wy = s2wY(sy);
  z = Math.max(0.1, Math.min(4, z * f));
  if (!isFinite(z)) z = 1; // safety net
  panX = sx - wx * z;
  panY = sy - wy * z;
  zoomLbl.textContent = (Number.isFinite(z) ? Math.round(z * 100) : 100) + '%';
  draw();
}
function zoomToFit() {
  if (!scene.items.length) { z = 1; panX = 60; panY = 80; zoomLbl.textContent = '100%'; draw(); return; }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of scene.items) {
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  const usableW = W - 250;
  const dw = x1 - x0 || 1; // guard against zero-width (prevents NaN)
  const dh = y1 - y0 || 1; // guard against zero-height (prevents NaN)
  z = Math.max(0.1, Math.min(1.5, Math.min(usableW / dw, (H - 120) / dh)));
  if (!isFinite(z)) z = 1; // final safety net
  panX = (usableW - dw * z) / 2 - x0 * z;
  panY = (H - dh * z) / 2 - y0 * z;
  zoomLbl.textContent = (Number.isFinite(z) ? Math.round(z * 100) : 100) + '%';
  draw();
}

/* ---------- exportar / importar ---------- */
function exportPng() {
  if (!scene.items.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of scene.items) {
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  const pad = 40, scale = 2;
  const off = document.createElement('canvas');
  off.width = Math.round((x1 - x0 + pad * 2) * scale);
  off.height = Math.round((y1 - y0 + pad * 2) * scale);
  const g = off.getContext('2d');
  g.fillStyle = scene.bg || (document.body.dataset.theme === 'dark' ? '#131316' : '#ffffff');
  g.fillRect(0, 0, off.width, off.height);
  g.scale(scale, scale);
  g.translate(pad - x0, pad - y0);
  drawItems(g, false);
  const a = document.createElement('a');
  a.href = off.toDataURL('image/png');
  a.download = 'drawrdis.png';
  a.click();
}

/* ---------- download / nome ---------- */
function slug(s) {
  return String(s || 'quadro').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9-_ ]/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'quadro';
}
function download(content, mime, filename) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- links de navegação + modo apresentação ---------- */
function linkTargetBox(it) {
  if (it.g) {
    const ids = scene.items.filter(i => i.g === it.g).map(i => i.id);
    const gb = groupBoxOf(ids);
    if (gb) return { bx: gb.x, by: gb.y, w: gb.w, h: gb.h };
  }
  return rotAABB(it);
}
function jumpToItem(target) {
  const b = linkTargetBox(target);
  const pad = 60;
  const nz = Math.max(0.1, Math.min(2, Math.min(W / (b.w + pad * 2), H / (b.h + pad * 2))));
  const z0 = z, px0 = panX, py0 = panY;
  const ppx = (W - b.w * nz) / 2 - b.bx * nz, ppy = (H - b.h * nz) / 2 - b.by * nz;
  const t0 = performance.now(), dur = 320;
  const ease = k => 1 - Math.pow(1 - k, 3);
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur), e = ease(k);
    z = z0 + (nz - z0) * e; panX = px0 + (ppx - px0) * e; panY = py0 + (ppy - py0) * e;
    zoomLbl.textContent = Math.round(z * 100) + '%';
    draw();
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function togglePresent() {
  present = !present;
  document.body.classList.toggle('present', present);
  presentbar.classList.toggle('open', present);
  if (present) {
    selIds = [];
    setTool('select');
    document.getElementById('presentHint').textContent = t('presentHint', 'clique num elemento com link para navegar · Esc para sair');
    document.getElementById('presentExit').textContent = t('presentExit', 'Sair');
    const linked = scene.items.find(i => i.link && i.link.to);
    const first = linked && scene.items.find(i => i.id === linked.link.to);
    if (first) jumpToItem(first);
    else zoomToFit();
  }
  draw();
}
document.getElementById('presentExit').onclick = togglePresent;

/* ---------- busca ---------- */
let searchMatches = [], searchIdx = -1;

function closeSearch() { searchbar.classList.remove('open'); searchMatches = []; searchIdx = -1; }
function runSearch() {
  const q = searchIn.value.trim().toLowerCase();

  searchIdx = -1;

/* ---------- lock de objeto ---------- */
function toggleLockSel() {
  if (!selIds.length) return;
  const before = subsetSnap(selIds);
  const anyUnlocked = selIds.some(id => { const it = scene.items.find(i => i.id === id); return it && !it.locked; });
  for (const id of selIds) { const it = scene.items.find(i => i.id === id); if (it) it.locked = anyUnlocked; }
  pushPatch(before, subsetSnap(selIds), selIds);
  save(); draw();
  setHint(anyUnlocked ? selIds.length + ' itens travados (Ctrl+Shift+L solta)' : 'itens destravados');
}
function unlockAll() {
  const locked = scene.items.filter(i => i.locked).map(i => i.id);
  if (!locked.length) { setHint('nada travado no quadro'); return; }
  const before = subsetSnap(locked);
  for (const id of locked) scene.items.find(i => i.id === id).locked = false;
  pushPatch(before, subsetSnap(locked), locked);
  save(); draw();
  setHint(locked.length + ' itens destravados');

/* ---------- exportar SVG ---------- */
// Os construtores de geometria (roughPath, pathOfShape, smoothPath) falam a

    lineTo(x, y) { cx = x; cy = y; cmds.push('L' + r2(x) + ' ' + r2(y)); },
    quadraticCurveTo(qx, qy, x, y) { cx = x; cy = y; cmds.push('Q' + r2(qx) + ' ' + r2(qy) + ' ' + r2(x) + ' ' + r2(y)); },
    arcTo(x1, y1, x2, y2, r) {
      const x0 = cx, y0 = cy;

      let dx2 = x2 - x1, dy2 = y2 - y1;
      const l0 = Math.hypot(dx0, dy0) || 1, l2 = Math.hypot(dx2, dy2) || 1;
      dx0 /= l0; dy0 /= l0; dx2 /= l2; dy2 /= l2;
      const cosA = dx0 * dx2 + dy0 * dy2;
      if (Math.abs(cosA) > 0.9994 || r < 0.01) { this.lineTo(x1, y1); return; }
      const tan = r / Math.sqrt(1 - cosA * cosA);

      cmds.push('A' + r2(rx) + ' ' + r2(ry) + ' 0 1 1 ' + r2(x - rx) + ' ' + r2(y));

/* ---------- exportar Excalidraw ---------- */
async function toForeign() {
  const files = {};
  const elements = [];
  for (const it of scene.items) {
    const b = itemBox(it);
    const base = {
      id: it.id, x: b.bx, y: b.by, width: b.w, height: b.h, angle: it.angle || 0,
      strokeColor: it.stroke || INK,
      backgroundColor: (it.fill && it.fill !== 'transparent') ? it.fill : 'transparent',
      strokeWidth: it.strokeWidth ?? 2, strokeStyle: it.strokeStyle || 'solid',
      roughness: it.roughness ?? 1, opacity: it.opacity ?? 100,
      seed: 1, version: 1, versionNonce: 1, isDeleted: false, groupIds: it.g ? [it.g] : [],
      frameId: null, roundness: null, boundElements: null, updated: Date.now(),
      link: null, locked: !!it.locked, fillStyle: it.fillStyle || 'solid',
    };
    if (it.type === 'rect') elements.push({ ...base, type: 'rectangle', roundness: (it.r ?? 0) > 0 ? { type: 3 } : null });
    else if (it.type === 'ellipse') elements.push({ ...base, type: 'ellipse', roundness: { type: 2 } });
    else if (it.type === 'diamond') elements.push({ ...base, type: 'diamond' });
    else if (it.type === 'line' || it.type === 'arrow') {
      const cp = curvePts(it);
      const el = {
        ...base, x: it.x, y: it.y, type: it.type,
        points: cp.map(p => [p[0] - it.x, p[1] - it.y]),
        lastCommittedPoint: null, startArrowhead: null, endArrowhead: it.type === 'arrow' ? 'arrow' : null,
      };
      if (it.startBind) el.startBinding = { elementId: it.startBind.id, focus: 0, gap: 1 };
      if (it.endBind) el.endBinding = { elementId: it.endBind.id, focus: 0, gap: 1 };
      elements.push(el);
    } else if (it.type === 'draw') {
      const p0 = it.points[0] || [0, 0];
      elements.push({ ...base, x: p0[0], y: p0[1], type: 'freedraw', points: it.points.map(p => [p[0] - p0[0], p[1] - p0[1]]), simulatePressure: false, pressures: [] });
    } else if (it.type === 'text') {
      elements.push({
        ...base, type: 'text', text: it.text || '', fontSize: it.fontSize || 20,
        fontFamily: it.fontFamily === 'code' ? 3 : it.fontFamily === 'normal' ? 2 : 1,
        textAlign: it.textAlign || 'left', verticalAlign: 'top', containerId: null,
        originalText: it.text || '', lineHeight: 1.25, autoResize: true,
      });
    } else if (it.type === 'image') {
      let src = it.src;
      if (typeof src === 'string' && src.startsWith('/')) {
        try {
          const blob = await (await fetch(src)).blob();
          src = await new Promise((res, rej) => {
            const rd = new FileReader();
            rd.onload = () => res(rd.result);
            rd.onerror = rej;
            rd.readAsDataURL(blob);
          });
        } catch { /* mantém a URL; o Excalidraw pode não carregar */ }
      }
      const fileId = 'drawrdis-' + it.id;
      files[fileId] = { mimeType: 'image/webp', dataURL: src };
      elements.push({ ...base, type: 'image', fileId, status: 'saved', scale: [1, 1], crop: null });
    }
  }
  return { type: 'excalidraw', version: 2, source: 'drawrdis', elements, appState: { viewBackgroundColor: scene.bg || '#ffffff' }, files };
}

  if (!scene.items.length) return;

async function renderBoards() {
  bdlg.innerHTML = '';
  el('h5', { textContent: t('boardsTitle', 'Quadros salvos') }, bdlg);
  const row = el('div', { className: 'brow' }, bdlg);
  const inp = el('input', { type: 'text', placeholder: t('boardsPh', 'nome do quadro…'), maxLength: 60 }, row);
  const btn = el('button', { textContent: t('boardsSave', 'Salvar'), title: t('boardsSaveT', 'Salva o quadro atual com esse nome') }, row);
  btn.style.cssText = 'border-radius:8px;background:var(--accent2);color:var(--accent);font-weight:600;padding:7px 12px;';
  const list = el('div', { className: 'blist' }, bdlg);
  const hint = el('div', { className: 'bhint', textContent: t('boardsHint', 'Abrir substitui o quadro atual (Ctrl+Z desfaz). O quadro atual continua salvando sozinho enquanto você desenha.') }, bdlg);
  btn.onclick = async () => {
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    await fetch('/boards', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, scene }) });
    setHint(`quadro "${name}" salvo`);
    inp.value = '';
    renderBoards();
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') btn.click();
    if (e.key === 'Escape') bdlg.classList.remove('open');
  });
  try {
    const boards = await (await fetch('/boards')).json();
    if (!boards.length) {
      el('div', { className: 'bempty', textContent: t('boardsEmpty', 'nenhum quadro salvo ainda') }, list);
      return;
    }
    for (const b of boards) {
      const item = el('div', { className: 'bitem' }, list);
      const meta = el('div', { className: 'bmeta' }, item);
      el('div', { className: 'bname', textContent: b.title }, meta);
      el('div', { className: 'bsub', textContent: `${b.items} itens · ${new Date(b.date).toLocaleDateString('pt-BR')} ${new Date(b.date).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` }, meta);
      const open = el('button', { textContent: t('boardsOpen', 'Abrir'), title: t('boardsOpenT', 'Abrir este quadro') }, item);
      open.onclick = async () => {
        const sc = await (await fetch('/boards/' + b.file)).json();
        pushUndo(JSON.stringify(scene.items));
        scene = { version: 1, title: sc.title || scene.title, bg: sc.bg || null, bgMode: sc.bgMode, items: sc.items };
        selIds = [];
        save();
        zoomToFit(); refreshPanel(); markBgMode();
        bdlg.classList.remove('open');
        setHint(`quadro "${b.title}" aberto — Ctrl+Z volta ao anterior`);
      };
      const del = el('button', { textContent: '×', title: 'Excluir quadro salvo' }, item);
      del.onclick = async () => {
        await fetch('/boards/' + b.file, { method: 'DELETE' });
        renderBoards();
      };
    }

    el('div', { className: 'bempty', textContent: 'sem conexão com o servidor' }, list);
  }
}

function hexToRgb(h) {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(h)) return null;

  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/* ---------- fluxo: Ctrl+setas clona o elemento na direção e liga ---------- */
function createFlowDir(dir) {
  if (!selIds.length) { setHint('selecione um elemento e use Ctrl+setas'); return; }
  const ord0 = orderIds();
  const sel = scene.items.filter(i => selIds.includes(i.id));
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of sel) {
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  const gap = 140;
  const dx = dir === 'right' ? (x1 - x0) + gap : dir === 'left' ? -((x1 - x0) + gap) : 0;
  const dy = dir === 'down' ? (y1 - y0) + gap : dir === 'up' ? -((y1 - y0) + gap) : 0;
  const map = new Map();
  const clones = [];
  for (const s of sel) {
    const c = JSON.parse(JSON.stringify(s));
    c.id = uid();
    shiftItem(c, dx, dy);
    clones.push(c);
    map.set(s.id, c);
  }
  for (const c of clones) {
    if (c.startBind && map.has(c.startBind.id)) c.startBind.id = map.get(c.startBind.id).id;
    if (c.endBind && map.has(c.endBind.id)) c.endBind.id = map.get(c.endBind.id).id;
  }
  const primary = sel[0];
  const counter = map.get(primary.id);
  const pcx = (x0 + x1) / 2, pcy = (y0 + y1) / 2;
  const flowArrow = {
    id: uid(), type: 'arrow',
    x: pcx, y: pcy, x2: pcx + dx, y2: pcy + dy,
    stroke: cur.stroke, strokeWidth: 2, fill: 'transparent',
    strokeStyle: 'solid', roughness: 1, opacity: 100,
    startBind: { id: primary.id }, endBind: { id: counter.id },
  };
  scene.items.push(...clones, flowArrow);
  const added = [...clones, flowArrow].map(c => c.id);
  pushOp(nullMap(added), subsetSnap(added), added, ord0, orderIds());
  selIds = [counter.id];
  setTool('select');
  save(); draw(); refreshPanel();
  setHint('fluxo criado ' + ({ up: 'acima', down: 'abaixo', left: 'à esquerda', right: 'à direita' })[dir]);
}
/* ---------- fluxo: Ctrl+Enter clona a tela e liga com seta ---------- */
function createFlow() {
  const sel = scene.items.find(i => i.id === selIds[0]);
  if (!sel) { setHint('selecione um elemento pra criar o fluxo'); return; }
  const sb = rotAABB(sel);
  let frame = null, fb = null;
  for (const it of scene.items) {
    if (it.type !== 'rect' || it.id === sel.id) continue;
    if (it.w < 80 || it.h < 80) continue;
    const b = rotAABB(it);
    if (b.bx - 2 <= sb.bx && b.by - 2 <= sb.by && b.bx + b.w + 2 >= sb.bx + sb.w && b.by + b.h + 2 >= sb.by + sb.h) {
      if (!frame || b.w * b.h < fb.w * fb.h) { frame = it; fb = b; }
    }
  }
  const ord0 = orderIds();
  const srcs = [];
  if (frame) {
    srcs.push(frame);
    for (const it of scene.items) {
      if (it.id === frame.id) continue;
      const b = rotAABB(it);
      if (b.bx >= fb.bx - 2 && b.by >= fb.by - 2 && b.bx + b.w <= fb.bx + fb.w + 2 && b.by + b.h <= fb.by + fb.h + 2) srcs.push(it);
    }
  } else {
    srcs.push(sel);
  }
  const dx = Math.round((frame ? fb.w : sb.w) + 160);
  const clones = [];
  const map = new Map();
  for (const s of srcs) {
    const c = JSON.parse(JSON.stringify(s));
    c.id = uid();
    c._src = s.id;
    shiftItem(c, dx, 0);
    clones.push(c);
    map.set(s.id, c);
  }
  for (const c of clones) {
    if (c.startBind && map.has(c.startBind.id)) c.startBind.id = map.get(c.startBind.id).id;
    if (c.endBind && map.has(c.endBind.id)) c.endBind.id = map.get(c.endBind.id).id;
  }
  const counterpart = map.get(sel.id) || clones[0];
  scene.items.push(...clones);
  const arrow = {
    id: uid(), type: 'arrow',
    x: sb.bx + sb.w, y: sb.by + sb.h / 2,
    x2: sb.bx + sb.w + dx, y2: sb.by + sb.h / 2,
    stroke: cur.stroke, strokeWidth: 2, fill: 'transparent',
    strokeStyle: 'solid', roughness: 1, opacity: 100,
    startBind: { id: sel.id }, endBind: { id: counterpart.id },
  };
  scene.items.push(arrow);
  for (const c of clones) delete c._src;
  const added = [...clones, arrow].map(c => c.id);
  pushOp(nullMap(added), subsetSnap(added), added, ord0, orderIds());
  selIds = [counterpart.id];
  setTool('select');
  save(); draw(); refreshPanel();
  setHint('fluxo criado — a tela nova está ligada por seta');
}
function selFirst() {

function panelKind() {

function refreshPanel() {

  panelEl.classList.toggle('show', show);
  if (!show) return;
  const it = selFirst();
  for (const s of panelEl.querySelectorAll('.sec')) {
    s.classList.toggle('off', !s.dataset.kinds.includes(kind));
  }
  const TYPE_EN = { rect: 'Rectangle', ellipse: 'Ellipse', diamond: 'Diamond', text: 'Text', line: 'Line', arrow: 'Arrow', draw: 'Stroke', image: 'Image' };
  const label = k => (lang === 'en' && TYPE_EN[k]) ? TYPE_EN[k] : (TYPE_LABEL[k] || 'Item');
  panel.ptitle.textContent = it
    ? label(it.type) + (selIds.length > 1 ? ` +${selIds.length - 1}` : '')
    : label(tool === 'text' ? 'text' : tool);
  panel.pcount.textContent = it ? `${selIds.length} selecionado${selIds.length > 1 ? 's' : ''}` : '';

  const eff = it ? {
    stroke: it.stroke, fill: it.fill, fillStyle: it.fillStyle ?? 'solid',
    strokeWidth: it.strokeWidth ?? 2, strokeStyle: it.strokeStyle ?? 'solid',
    roughness: it.roughness ?? 0, opacity: it.opacity ?? 100,

  panel.strokeCustom.classList.toggle('on', !STROKES.includes(eff.stroke) && /^#([0-9a-f]{6})$/i.test(eff.stroke));
  const hasFill = kind === 'shape';
  const noFill = eff.fill === 'transparent' || !hasFill;
  for (const [c, b] of Object.entries(panel.fillBtns)) {
    b.classList.toggle('on', hasFill && c === eff.fill);
    b.disabled = !hasFill;
  }
  panel.fillCustom.style.background = /^#([0-9a-f]{6})$/i.test(eff.fill)
    ? eff.fill
    : 'repeating-linear-gradient(45deg,#fff,#fff 3px,#ddd 3px,#ddd 6px)';
  panel.fillCustom.classList.toggle('on', hasFill && !FILLS.includes(eff.fill) && /^#([0-9a-f]{6})$/i.test(eff.fill));
  panel.fillCustom.disabled = !hasFill;
  for (const b of Object.values(panel.fillStyle)) b.disabled = noFill;
  markSeg(panel.fillStyle, noFill ? '—' : (eff.fillStyle ?? 'solid'));
  markSeg(panel.strokeWidth, String(eff.strokeWidth ?? 2));
  markSeg(panel.strokeStyle, eff.strokeStyle ?? 'solid');
  markSeg(panel.roughness, String(eff.roughness ?? 0));
  markSeg(panel.edges, eff.r === null || eff.r === undefined ? '—' : (eff.r >= 5 ? '32' : '0'));
  if (kind === 'text') {
    markSeg(panel.fontFamily, eff.fontFamily || 'hand');
    markSeg(panel.fontSize, String(eff.fontSize || 20));
    markSeg(panel.textAlign, eff.textAlign || 'left');

function markSeg(btns, val) {
  for (const [v, b] of Object.entries(btns)) b.classList.toggle('on', v === String(val));

function setStyle(patch) {
  Object.assign(cur, patch);
  const targets = scene.items.filter(i => selIds.includes(i.id));
  const before = targets.length ? subsetSnap(targets.map(i => i.id)) : null;
  for (const it of targets) {
    if ('stroke' in patch) it.stroke = patch.stroke;
    if ('fill' in patch && ['rect', 'ellipse', 'diamond'].includes(it.type)) it.fill = patch.fill;
    if ('fillStyle' in patch && ['rect', 'ellipse', 'diamond'].includes(it.type)) it.fillStyle = patch.fillStyle;
    if ('strokeWidth' in patch) it.strokeWidth = patch.strokeWidth;
    if ('strokeStyle' in patch) it.strokeStyle = patch.strokeStyle;
    if ('roughness' in patch && it.type !== 'image') it.roughness = patch.roughness;
    if ('opacity' in patch) it.opacity = patch.opacity;
    if ('r' in patch && it.type === 'rect') it.r = patch.r;
    if ('fontFamily' in patch && it.type === 'text') it.fontFamily = patch.fontFamily;
    if ('fontSize' in patch && it.type === 'text') it.fontSize = patch.fontSize;
    if ('textAlign' in patch && it.type === 'text') it.textAlign = patch.textAlign;
    if ('bold' in patch && it.type === 'text') it.bold = patch.bold;
  }
  if (targets.length) {
    pushPatch(before, subsetSnap(targets.map(i => i.id)), targets.map(i => i.id));

/* ---------- recorte de render (modo snap do agente) ---------- */
function snapRegion() {
  const q = new URLSearchParams(location.search);
  let box = null;
  if (q.get('bbox')) {
    const v = q.get('bbox').split(',').map(Number);
    if (v.length === 4 && v.every(Number.isFinite)) {
      box = { bx: Math.min(v[0], v[2]), by: Math.min(v[1], v[3]), w: Math.abs(v[2] - v[0]), h: Math.abs(v[3] - v[1]) };
    }
  } else if (q.get('ids')) {
    const ids = new Set(q.get('ids').split(',').filter(Boolean));
    const gs = new Set();
    for (const it of scene.items) if (ids.has(it.id) && it.g) gs.add(it.g);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, n = 0;
    for (const it of scene.items) {
      if (!ids.has(it.id) && !(it.g && gs.has(it.g))) continue;
      const b = rotAABB(it);
      x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
      x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h); n++;
    }
    if (n) box = { bx: x0, by: y0, w: x1 - x0, h: y1 - y0 };
  }
  if (!box) { zoomToFit(); return; }
  const pad = 40;
  const dw = Math.max(box.w, 1) + pad * 2, dh = Math.max(box.h, 1) + pad * 2;
  z = Math.max(0.1, Math.min(2, Math.min(W / dw, H / dh)));
  panX = (W - box.w * z) / 2 - box.bx * z;
  panY = (H - box.h * z) / 2 - box.by * z;
  zoomLbl.textContent = Math.round(z * 100) + '%';
  draw();
}

/* ---------- redimensionar / iniciar ---------- */
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  draw();
}
window.addEventListener('resize', resize);

  if (tq && TOOLS.some(([id]) => id === tq)) setTool(tq);

  if (pk === 'stroke' || pk === 'fill') openCpick(pk, zoomLbl);
  refreshBL();

  if (new URLSearchParams(location.search).has('test')) runTests();
