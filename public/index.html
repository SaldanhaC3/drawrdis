<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Drawrdis</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --ink: #1b1b1f;
    --ink2: #625f6d;
    --paper: #fafafa;
    --bar: #ffffff;
    --line: #e6e6ea;
    --accent: #6965db;
    --accent2: #e0dcff;
    --sel: #6965db;
    --isl-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  [data-theme="dark"] {
    --ink: #e6e6ea;
    --ink2: #9b98a6;
    --paper: #121214;
    --bar: #1e1e22;
    --line: #34343a;
    --accent: #837dff;
    --accent2: #3c3a5c;
    --isl-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
  }
  .isl {
    position: fixed; z-index: 20;
    background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--isl-shadow);
    display: flex; align-items: center;
  }
  button {
    font: 12px 'Segoe UI', system-ui, sans-serif;
    color: var(--ink); background: transparent;
    border: none; border-radius: 8px;
    padding: 6px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  button.on { background: var(--accent2); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:hover { background: transparent; }
  button svg { display: block; }
  .div { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

  #menuBtn { top: 12px; left: 12px; padding: 9px; }
  #tb { top: 12px; left: 50%; transform: translateX(-50%); padding: 4px 6px; gap: 2px; }
  .num { font-size: 9px; opacity: .55; margin-left: -3px; align-self: flex-start; margin-top: 1px; }

  #hint {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    z-index: 15; font-size: 12px; color: var(--ink2);
    background: var(--bar); border: 1px solid var(--line); border-radius: 99px;
    padding: 3px 14px; box-shadow: var(--isl-shadow);
    max-width: 74vw; text-align: center; opacity: .92;
    transition: opacity .2s; pointer-events: none;
  }
  kbd { font: 11px Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bar); }

  #panel {
    position: fixed; z-index: 19; top: 64px; right: 12px;
    width: 248px; max-height: calc(100vh - 150px); overflow-y: auto;
    background: var(--bar); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--isl-shadow); padding: 0;
    display: none; flex-direction: column;
  }
  #panel.show { display: flex; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  #panel .phead {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px;
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  #panel .phead .ptitle { font-size: 14px; font-weight: 600; }
  #panel .phead .pcount { font-size: 12px; color: var(--ink2); margin-left: auto; }
  #panel .pclose { margin-left: 2px; padding: 2px 8px; font-size: 16px; line-height: 1; }
  .sec { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; }
  .sec h4 { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink); }
  .sec .sub { font-size: 11px; font-weight: 500; color: var(--ink2); margin-top: 2px; }
  .sec.off { display: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: flex; gap: 8px; margin: 0; }
  .seg button {
    flex: 1 1 0; height: 36px; min-width: 0; padding: 0;
    border-radius: 10px;
    background: color-mix(in srgb, var(--ink) 6%, transparent);
  }
  .seg button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .seg button.on { background: var(--accent2); box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
  .seg button svg { display: block; margin: 0 auto; }
  .sw { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); padding: 0; }
  .sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sw.custom { margin-left: 10px; box-shadow: inset 0 0 0 2px var(--accent2); border-color: var(--accent); }
  .mini { width: 30px; height: 28px; padding: 0; flex: none; }
  input[type="color"] { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .algrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
  .algrid.al2 { grid-template-columns: repeat(2, 1fr); }
  .algrid button { width: auto; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .algrid button.on { background: var(--accent2); box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }

  #bl { bottom: 12px; left: 12px; padding: 4px 6px; gap: 2px; }
  #zoomLbl { font-size: 12px; color: var(--ink2); min-width: 42px; text-align: center; cursor: pointer; padding: 6px 2px; border-radius: 8px; }
  #zoomLbl:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }

  #br { bottom: 12px; right: 12px; padding: 6px 10px; gap: 10px; font-size: 11px; color: var(--ink2); }
  #live { width: 8px; height: 8px; border-radius: 50%; background: #b9b6c6; display: inline-block; margin-right: 4px; }
  #live.on { background: #3d9a50; }
  #helpBtn { top: auto; bottom: 12px; right: 150px; padding: 9px; position: fixed; z-index: 20; }

  #menu {
    position: fixed; z-index: 30; top: 58px; left: 12px;
    width: 240px; background: var(--bar); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--isl-shadow); padding: 6px;
    display: none; flex-direction: column; gap: 1px;
  }
  #menu.open { display: flex; }
  #menu button { justify-content: flex-start; padding: 8px 10px; font-size: 13px; gap: 10px; }
  #menu .mkey { margin-left: auto; color: var(--ink2); font-size: 11px; }
  #menu hr { border: none; border-top: 1px solid var(--line); margin: 5px 0; }
  #menu .mrow { display: flex; align-items: center; gap: 4px; padding: 6px 10px; }
  #menu .mlbl { font-size: 12px; color: var(--ink2); margin-right: 2px; }

  #help {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35);
    display: none; align-items: center; justify-content: center;
  }
  #help.open { display: flex; }
  #help .card {
    background: var(--bar); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--isl-shadow); padding: 22px 26px; max-width: 560px; max-height: 80vh; overflow: auto;
  }
  #help h3 { margin: 0 0 12px; }
  #help table { border-collapse: collapse; font-size: 12.5px; }
  #help td { padding: 3px 14px 3px 0; color: var(--ink2); }
  #help td:first-child { color: var(--ink); white-space: nowrap; }

  #ed {
    position: absolute; display: none; z-index: 25;
    background: rgba(255,255,255,.9); border: 1.5px dashed var(--sel);
    outline: none; resize: none; overflow: hidden;
    line-height: 1.3; padding: 0; margin: 0;
  }
  [data-theme="dark"] #ed { background: rgba(30,30,34,.9); }

  #cv { position: fixed; inset: 0; display: block; }
  body.zen .chrome { display: none !important; }
  #fileIn, #imgIn { display: none; }

  #cpick {
    position: fixed; z-index: 60; width: 228px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--isl-shadow); padding: 12px;
    display: none; flex-direction: column; gap: 10px;
  }
  #cpick.open { display: flex; }

  #bdlg {
    position: fixed; z-index: 60; width: 268px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--isl-shadow); padding: 14px;
    display: none; flex-direction: column; gap: 10px;
  }
  #bdlg.open { display: flex; }
  #bdlg h5 { margin: 0; font-size: 13px; font-weight: 600; }
  #bdlg .brow { display: flex; gap: 4px; }
  #bdlg input[type="text"] {
    flex: 1; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--ink); padding: 7px 10px;
    font: 13px 'Segoe UI', system-ui, sans-serif; outline: none; min-width: 0;
  }
  #bdlg .blist { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
  #bdlg .bitem {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
  }
  #bdlg .bitem .bmeta { flex: 1; min-width: 0; }
  #bdlg .bitem .bname { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bdlg .bitem .bsub { font-size: 11px; color: var(--ink2); }
  #bdlg .bitem button { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
  #bdlg .bempty { font-size: 12px; color: var(--ink2); text-align: center; padding: 10px 0; }
  #bdlg .bhint { font-size: 11px; color: var(--ink2); }
  #cpick h5 { margin: 2px 0 0; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
  .cgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .cgrid button {
    width: 100%; aspect-ratio: 1; border-radius: 6px;
    border: 1px solid var(--line); padding: 0; min-width: 0;
  }
  .cgrid button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chex { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .chex span { color: var(--ink2); font: 13px Consolas, monospace; }
  .chex input {
    border: none; outline: none; background: transparent; color: var(--ink);
    font: 13px Consolas, monospace; width: 100%; text-transform: lowercase;
  }
  .cprev { width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--line); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="isl chrome" id="menuBtn" title="Menu"></button>
<div class="isl chrome" id="tb"></div>
<div id="hint" class="chrome"></div>
<div id="panel"></div>
<div class="isl chrome" id="bl"></div>
<button class="isl chrome" id="helpBtn" title="Ajuda (?)"></button>
<div class="isl chrome" id="br"><span><span id="live"></span><span id="livetxt">conectando…</span></span><span id="save">—</span></div>
<div id="menu"></div>
<div id="cpick"></div>
<div id="bdlg"></div>
<div id="help"><div class="card"><h3>Atalhos</h3><div id="helpBody"></div></div></div>
<textarea id="ed" spellcheck="false"></textarea>
<input type="file" id="fileIn" accept=".drawrdis,.json,.excalidraw,application/json">
<input type="file" id="imgIn" accept="image/*" multiple>
<pre id="testout" style="position:fixed;left:8px;top:90px;z-index:99;background:#fff;color:#000;font:12px Consolas;max-width:50vw;display:none;white-space:pre-wrap"></pre>

<script>
'use strict';
const FONT_HAND = "'Segoe Print', 'Comic Sans MS', cursive";
const FONT_NORMAL = "'Segoe UI', system-ui, sans-serif";
const FONT_CODE = "Consolas, 'Cascadia Code', monospace";
const fontOf = f => f === 'hand' ? FONT_HAND : f === 'code' ? FONT_CODE : FONT_NORMAL;
const INK = '#1b1b1f';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const ed = document.getElementById('ed');
const liveEl = document.getElementById('live');
const livetxt = document.getElementById('livetxt');
const saveEl = document.getElementById('save');
const hintEl = document.getElementById('hint');
const panelEl = document.getElementById('panel');
const menuEl = document.getElementById('menu');
const fileIn = document.getElementById('fileIn');
const imgIn = document.getElementById('imgIn');

let scene = { version: 1, title: 'Drawrdis', bg: null, items: [] };
let z = 1, panX = 60, panY = 80;
let W = 0, H = 0, dpr = 1;

let tool = 'select';
let lockTool = false;
let stampMode = null;
let selIds = [];
let hoverId = null;
let bindHover = null;
let mode = null;           // pan|move|resize|rotate|create|marquee
let spaceDown = false;
let editingId = null;
let gesture = {}, gestureSnap = null;
let marquee = null;
let marqueeCands = [];
let clip = [];
let undoStack = [], redoStack = [];
let dirty = false, stale = false;
let snapOn = false;
let zen = false;
const imgCache = new Map();

const cur = {
  stroke: INK, fill: 'transparent', fillStyle: 'hachure', strokeWidth: 2,
  strokeStyle: 'solid', roughness: 1, opacity: 100, r: 8,
  fontSize: 20, fontFamily: 'hand', bold: false, textAlign: 'left',
};

/* ---------- câmera ---------- */
const s2wX = sx => (sx - panX) / z;
const s2wY = sy => (sy - panY) / z;
const w2sX = wx => wx * z + panX;
const w2sY = wy => wy * z + panY;
const uid = () => crypto.randomUUID().slice(0, 12);
const S = v => snapOn ? Math.round(v / 20) * 20 : v;

/* ---------- utilitários ---------- */
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  if (g.beginPath) g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function centerOf(it) {
  const b = itemBox(it);
  return { x: b.bx + b.w / 2, y: b.by + b.h / 2 };
}
function rot(px, py, cx, cy, a) {
  const dx = px - cx, dy = py - cy, c = Math.cos(a), s = Math.sin(a);
  return [cx + dx * c - dy * s, cy + dx * s + dy * c];
}
function dashOf(it) {
  if (it.strokeStyle === 'dashed') return [10, 8];
  if (it.strokeStyle === 'dotted') return [1.5, 6];
  return [];
}

/* ---------- geometria de itens ---------- */
function wrapLines(paras, maxW) {
  const out = [];
  for (const para of paras) {
    if (!para) { out.push(''); continue; }
    const words = para.split(' ');
    let line = '';
    for (const wd of words) {
      const cand = line ? line + ' ' + wd : wd;
      if (ctx.measureText(cand).width <= maxW || !line) {
        if (!line && ctx.measureText(wd).width > maxW) {
          let chunk = '';
          for (const ch of wd) {
            if (chunk && ctx.measureText(chunk + ch).width > maxW) { out.push(chunk); chunk = ch; }
            else chunk += ch;
          }
          line = chunk;
          continue;
        }
        line = cand;
      } else {
        out.push(line);
        line = wd;
      }
    }
    out.push(line);
  }
  return out;
}
function ensureTextSize(it) {
  // Guard: fontSize must be a finite positive number; default to 14 if missing/invalid
  const fs = Number(it.fontSize);
  if (!isFinite(fs) || fs <= 0) it.fontSize = 14;
  // cache de layout: measureText é caro; só refaz se texto/fonte/largura mudarem
  const sig = [it.text, it.fontSize, it.bold ? 1 : 0, it.fontFamily, it.autoW ? 'a' : (it.w || 0)].join('|');
  if (it._tsig === sig && it._lines) return;
  it._tsig = sig;
  ctx.font = (it.bold ? '700 ' : '400 ') + it.fontSize + 'px ' + fontOf(it.fontFamily);
  const paras = String(it.text ?? '').split('\n');
  if (it.autoW || !it.w) {
    let w = 10;
    for (const ln of paras) w = Math.max(w, ctx.measureText(ln).width);
    it.w = Math.ceil(w) + 2;
  }
  const lines = wrapLines(paras, it.w);
  it.h = Math.ceil(lines.length * it.fontSize * 1.3);
  it._lines = lines;
}
function textBox(it) {
  ensureTextSize(it);
  return { bx: it.align === 'center' ? it.x - it.w / 2 : it.x, by: it.y, w: it.w, h: it.h };
}
function drawBox(it) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of it.points) {
    x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]);
    x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
  }
  return { bx: x0 - 6, by: y0 - 6, w: x1 - x0 + 12, h: y1 - y0 + 12 };
}
function curvePts(it) {
  let x = it.x, y = it.y, x2 = it.x2, y2 = it.y2;
  if (it.startBind) {
    const s = scene.items.find(i => i.id === it.startBind.id);
    if (s) [x, y] = borderPointFromBind(s, it.startBind, x2, y2);
  }
  if (it.endBind) {
    const s = scene.items.find(i => i.id === it.endBind.id);
    if (s) [x2, y2] = borderPointFromBind(s, it.endBind, x, y);
  }
  const pts = [[x, y]];
  if (it.mids) for (const m of it.mids) pts.push(m);
  pts.push([x2, y2]);
  return pts;
}
// remove binds que apontam para itens inexistentes (chamado ao salvar/carregar,
// não dentro de curvePts, para manter curvePts puro e cacheável)
function pruneDanglingBinds() {
  const ids = new Set(scene.items.map(i => i.id));
  for (const it of scene.items) {
    if (it.type !== 'line' && it.type !== 'arrow') continue;
    if (it.startBind && !ids.has(it.startBind.id)) { it.x = curvePts(it)[0][0]; it.y = curvePts(it)[0][1]; delete it.startBind; }
    if (it.endBind && !ids.has(it.endBind.id)) { const cp = curvePts(it); it.x2 = cp[cp.length - 1][0]; it.y2 = cp[cp.length - 1][1]; delete it.endBind; }
  }
}
// ponto na borda da forma, na direção de (fromX, fromY)
function borderPoint(shape, fromX, fromY) {
  const b = rotAABB(shape);
  const cx = b.bx + b.w / 2, cy = b.by + b.h / 2;
  const dx = fromX - cx, dy = fromY - cy;
  if (!dx && !dy) return [cx, cy - b.h / 2];
  if (shape.type === 'ellipse') {
    const den = Math.sqrt((dx / (b.w / 2)) ** 2 + (dy / (b.h / 2)) ** 2) || 1;
    return [cx + dx / den, cy + dy / den];
  }
  const tx = dx ? (b.w / 2) / Math.abs(dx) : Infinity;
  const ty = dy ? (b.h / 2) / Math.abs(dy) : Infinity;
  const t = Math.min(tx, ty);
  return [cx + dx * t, cy + dy * t];
}
// ancoragem livre: se o bind tem rx/ry, usa a posição relativa exata dentro da
// caixa da forma; senão cai para o ponto de borda dinâmico (comportamento antigo)
function borderPointFromBind(shape, bind, fromX, fromY) {
  if (bind && Number.isFinite(bind.rx) && Number.isFinite(bind.ry)) {
    const b = rotAABB(shape);
    return [b.bx + bind.rx * b.w, b.by + bind.ry * b.h];
  }
  return borderPoint(shape, fromX, fromY);
}
// converte um ponto do mundo em coordenadas relativas [0,1] dentro da caixa da forma
function relPoint(shape, wx, wy) {
  const b = rotAABB(shape);
  const rx = b.w ? (wx - b.bx) / b.w : 0.5;
  const ry = b.h ? (wy - b.by) / b.h : 0.5;
  return { rx: Math.max(0, Math.min(1, rx)), ry: Math.max(0, Math.min(1, ry)) };
}
function bindTargetAt(wx, wy, arrowIt) {
  for (let i = scene.items.length - 1; i >= 0; i--) {
    const s = scene.items[i];
    if (s.id === arrowIt.id) continue;
    if (!['rect', 'ellipse', 'diamond', 'text', 'image'].includes(s.type)) continue;
    const b = rotAABB(s);
    const pad = 12 / z;
    if (wx >= b.bx - pad && wx <= b.bx + b.w + pad && wy >= b.by - pad && wy <= b.by + b.h + pad) return s;
  }
  return null;
}
function dropBindingsTo(ids) {
  for (const it of scene.items) {
    if (it.type !== 'line' && it.type !== 'arrow') continue;
    for (const key of ['startBind', 'endBind']) {
      const b = it[key];
      if (b && ids.includes(b.id)) {
        const cp = curvePts(it);
        if (key === 'startBind') { it.x = cp[0][0]; it.y = cp[0][1]; }
        else { it.x2 = cp[cp.length - 1][0]; it.y2 = cp[cp.length - 1][1]; }
        delete it[key];
      }
    }
  }
}
function smoothPath(g, pts) {
  g.moveTo(pts[0][0], pts[0][1]);
  if (pts.length === 2) {
    g.lineTo(pts[1][0], pts[1][1]);
    return;
  }
  for (let i = 1; i < pts.length - 1; i++) {
    const [nx, ny] = pts[i + 1];
    g.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + nx) / 2, (pts[i][1] + ny) / 2);
  }

      ctx.strokeStyle = lineCol;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let gy = y0; gy <= y1; gy += step) { ctx.moveTo(0, w2sY(gy)); ctx.lineTo(W, w2sY(gy)); }
      ctx.stroke();
    }
  }

  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(z, z);
  drawItems(ctx, true);
  ctx.restore();

  if (!zen) {
    if (hoverId && !selIds.includes(hoverId) && tool === 'select') {
      const hv = scene.items.find(i => i.id === hoverId);
      if (hv) {
        const b = rotAABB(hv);
        ctx.strokeStyle = 'rgba(105,101,219,.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 4]);
        ctx.strokeRect(w2sX(b.bx) - 2, w2sY(b.by) - 2, b.w * z + 4, b.h * z + 4);
        ctx.setLineDash([]);
      }
    }
    const selItems = scene.items.filter(i => selIds.includes(i.id));
    if (bindHover && !selIds.includes(bindHover.id)) {
      const b = rotAABB(bindHover);
      ctx.strokeStyle = '#6965db';
      ctx.lineWidth = 2;
      ctx.strokeRect(w2sX(b.bx) - 5, w2sY(b.by) - 5, b.w * z + 10, b.h * z + 10);
      // ancoragem livre (Alt): ponto azul no local exato onde a ponta vai grudar
      if (gesture.altFree && gesture.bendIt) {
        const bit = gesture.bendIt;
        const cpA = curvePts(bit);
        const idxA = Math.min(gesture.bendIdx, cpA.length - 1);
        const [tx, ty] = idxA === cpA.length - 1 ? [bit.x2, bit.y2] : [bit.x, bit.y];
        const rp = relPoint(bindHover, tx, ty);
        const ax = b.bx + rp.rx * b.w, ay = b.by + rp.ry * b.h;
        ctx.beginPath();
        ctx.arc(w2sX(ax), w2sY(ay), 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#1971c2';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
    for (const it of selItems) {
      const pts = rotCorners(it).map(p => [w2sX(p[0]), w2sY(p[1])]);
      ctx.strokeStyle = '#6965db';
      ctx.lineWidth = selItems.length > 1 ? 1 : 1.5;
      ctx.globalAlpha = selItems.length > 1 ? .6 : 1;
      ctx.beginPath();
      ctx.moveTo(pts[0][0] - 3, pts[0][1] - 3);
      for (let i = 1; i < 4; i++) {
        const [ax, ay] = pts[i - 1], [bx2, by2] = pts[i];
        const dx = Math.sign(bx2 - ax) * 3, dy = Math.sign(by2 - ay) * 3;
        ctx.lineTo(ax + dx, ay + dy);
        ctx.lineTo(bx2 - dx, by2 - dy);
      }
      ctx.lineTo(pts[3][0] + 3, pts[3][1] + 3);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (selItems.length > 1) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const it of selItems) {
        const b = rotAABB(it);
        x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
        x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
      }
      ctx.strokeStyle = '#6965db';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(w2sX(x0) - 4, w2sY(y0) - 4, (x1 - x0) * z + 8, (y1 - y0) * z + 8);
      ctx.setLineDash([]);
      // alças de canto: dá pra redimensionar o grupo inteiro de uma vez
      for (const [hx, hy] of [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]) {
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#6965db'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(w2sX(hx) - 4, w2sY(hy) - 4, 8, 8); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = '#6965db';
      ctx.font = '600 11px ' + FONT_NORMAL;
      ctx.textBaseline = 'bottom';
      const glabel = selItems.every(i => i.g && i.g === selItems[0].g) ? 'Grupo' : selItems.length + ' selecionados';
      ctx.fillText(glabel, w2sX(x0) - 4, w2sY(y0) - 8);
    }
    if (selItems.length === 1) {
      const it = selItems[0];
      if (it && (it.type === 'line' || it.type === 'arrow')) {
        const cp = curvePts(it);
        cp.forEach((p, i) => {
          ctx.beginPath();
          ctx.arc(w2sX(p[0]), w2sY(p[1]), i === 0 || i === cp.length - 1 ? 5 : 4, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#6965db';
          ctx.lineWidth = 1.5;
          ctx.fill(); ctx.stroke();
        });
      }
      if (it && ['rect', 'ellipse', 'diamond', 'image', 'draw', 'text'].includes(it.type)) {
        const pts = rotCorners(it).map(p => [w2sX(p[0]), w2sY(p[1])]);
        for (const p of pts) {
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#6965db';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.rect(p[0] - 4, p[1] - 4, 8, 8);
          ctx.fill(); ctx.stroke();
        }
        const [tmx, tmy] = rotHandleScreen(it);
        const top = pts[0], top2 = pts[1];
        ctx.beginPath();
        ctx.moveTo((top[0] + top2[0]) / 2, (top[1] + top2[1]) / 2);
        ctx.lineTo(tmx, tmy);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(tmx, tmy, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
      }
    }
  if (marquee) {
    const x = w2sX(Math.min(marquee.x0, marquee.x1)), y = w2sY(Math.min(marquee.y0, marquee.y1));
    const w = Math.abs(marquee.x1 - marquee.x0) * z, h = Math.abs(marquee.y1 - marquee.y0) * z;
    ctx.fillStyle = 'rgba(105,101,219,.08)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#6965db';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    for (const cid of marqueeCands) {
      const it = scene.items.find(i => i.id === cid);
      if (!it) continue;
      const b = rotAABB(it);
      ctx.strokeStyle = '#6965db';
      ctx.lineWidth = 1;
      ctx.strokeRect(w2sX(b.bx) - 2, w2sY(b.by) - 2, b.w * z + 4, b.h * z + 4);
    }
  }
  }
}
function rotHandleScreen(it) {
  const pts = rotCorners(it).map(p => [w2sX(p[0]), w2sY(p[1])]);
  const mx = (pts[0][0] + pts[1][0]) / 2, my = (pts[0][1] + pts[1][1]) / 2;
  const a = it.angle || 0;
  return [mx + Math.sin(a) * 28, my - Math.cos(a) * 28];
}

/* ---------- histórico ---------- */
// Entradas de undo são de dois tipos:
//   { f: '<json de todos os items>' }  → comandos que adicionam/removem itens
//   { p: { b, a, ids } }               → gestos de transformação (move/resize/
//                                         rotate/bend): guardam só os itens tocados.
// Isso corta o custo de serializar o board inteiro a cada pointerdown e a memória
// da pilha em boards grandes.
function subsetSnap(ids) {
  const set = new Set(ids), out = {};
  for (const it of scene.items) if (set.has(it.id)) out[it.id] = JSON.parse(JSON.stringify(it));
  return out;
}
function applyPatchMap(m) {
  scene.items = scene.items.map(it => (it.id in m) ? m[it.id] : it);
}
function pushUndo(snap) {
  undoStack.push({ f: snap });
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  refreshBL();
}
function pushPatch(before, after, ids) {
  undoStack.push({ p: { b: JSON.stringify(before), a: JSON.stringify(after), ids } });
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  refreshBL();
}
function undo() {
  if (!undoStack.length) return;
  const e = undoStack.pop();
  if (e.f) { redoStack.push({ f: JSON.stringify(scene.items) }); scene.items = JSON.parse(e.f); }
  else { redoStack.push({ p: { b: e.p.a, a: e.p.b, ids: e.p.ids } }); applyPatchMap(JSON.parse(e.p.b)); }
  selIds = selIds.filter(id => scene.items.some(i => i.id === id));
  save(); draw(); refreshBL(); refreshPanel();
}
function redo() {
  if (!redoStack.length) return;
  const e = redoStack.pop();
  if (e.f) { undoStack.push({ f: JSON.stringify(scene.items) }); scene.items = JSON.parse(e.f); }
  else { undoStack.push({ p: { b: e.p.a, a: e.p.b, ids: e.p.ids } }); applyPatchMap(JSON.parse(e.p.b)); }
  selIds = selIds.filter(id => scene.items.some(i => i.id === id));
  save(); draw(); refreshBL(); refreshPanel();
}
function refreshBL() {
  if (undoBtn) undoBtn.disabled = !undoStack.length;
  if (redoBtn) redoBtn.disabled = !redoStack.length;
}

/* ---------- agrupar / desagrupar ---------- */
// Um grupo é um conjunto de itens que compartilham o mesmo campo `g` (id do
// grupo). Selecionar um membro seleciona o grupo; mover/redimensionar age em
// todos juntos. Sem tipo novo: só um campo a mais no item, que o sync por
// diff já carrega.
function groupBoxOf(ids) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const id of ids) {
    const it = scene.items.find(i => i.id === id);
    if (!it) continue;
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  if (x1 < x0) return null;
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function expandGroup(ids) {
  const gs = new Set();
  for (const id of ids) { const it = scene.items.find(i => i.id === id); if (it && it.g) gs.add(it.g); }
  if (!gs.size) return ids.slice();
  const out = new Set(ids);
  for (const it of scene.items) if (it.g && gs.has(it.g)) out.add(it.id);
  return [...out];
}
function groupSel() {
  if (selIds.length < 2) { setHint('selecione 2+ itens para agrupar'); return; }
  pushUndo(JSON.stringify(scene.items));
  const gid = 'g' + uid();
  for (const id of selIds) { const it = scene.items.find(i => i.id === id); if (it) it.g = gid; }
  save(); draw();
  setHint(selIds.length + ' itens agrupados (Ctrl+Shift+G desfaz)');
}
function ungroupSel() {
  if (!selIds.length) return;
  pushUndo(JSON.stringify(scene.items));
  for (const id of selIds) { const it = scene.items.find(i => i.id === id); if (it) delete it.g; }
  save(); draw();
  setHint('grupo desfeito');
}

/* ---------- salvar / sincronizar ---------- */
// O editor não substitui a cena inteira: manda um diff por item
// (add/update/remove/order) e o servidor aplica sobre o estado atual.
// Itens que o agente escreveu no meio do caminho sobrevivem ao nosso save.
let saveTimer = null;
let baseStr = new Map(); // id -> JSON do item como estava no último sync
let lastRev = 0;
function rebase(s) {
  baseStr = new Map(s.items.map(i => [i.id, JSON.stringify(i)]));
  lastRev = s.rev || 0;
}
function save() {
  dirty = true;
  setStatus('salvando…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 350);
}
async function doSave() {
  try {
    pruneDanglingBinds();
    const add = [], update = [], sent = [], seen = new Set();
    for (const it of scene.items) {
      seen.add(it.id);
      const j = JSON.stringify(it);
      const b = baseStr.get(it.id);
      if (b === undefined) { add.push(it); sent.push([it.id, j]); }
      else if (b !== j) { update.push(it); sent.push([it.id, j]); }
    }
    const remove = [];
    for (const id of baseStr.keys()) if (!seen.has(id)) remove.push(id);
    if (add.length || update.length || remove.length) {
      const res = await fetch('/sync', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ rev: lastRev, add, update, remove, order: scene.items.map(i => i.id) }),
      });
      if (!res.ok) throw new Error((await res.text()).slice(0, 120));
      const r = await res.json();
      for (const [id, j] of sent) baseStr.set(id, j);
      for (const id of remove) baseStr.delete(id);
      lastRev = r.rev || lastRev;
    }
    dirty = false;
    setStatus('salvo ' + new Date().toLocaleTimeString());
    if (stale && !busy()) {
      stale = false;
      try {
        const s = await (await fetch('/scene')).json();
        if (!busy()) applyIncoming(s);
      } catch { /* próxima gravação reconcilia */ }
    }
  } catch (e) {
    setStatus('erro ao salvar: ' + e.message);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 2000);
  }
}
function busy() { return mode !== null || editingId !== null || dirty; }
// Defesa final: mesmo que um agente escreva board.json direto (modo arquivo,
// sem passar pelo server), itens com geometria NaN/Infinity são descartados
// antes de tocar o canvas, onde derrubariam o zoom e travariam o quadro.
function sanitizeScene(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.items)) {
    return { version: 1, title: (s && s.title) || 'Drawrdis', items: [] };
  }
  const bad = (v) => typeof v === 'number' && !Number.isFinite(v); // só NaN/Infinity; null/string legados passam
  const out = [];
  for (const it of s.items) {
    if (!it || typeof it !== 'object') continue;
    if (it.type === 'frame') it.type = 'rect'; // shim: frames do app antigo viram caixas, nada some
    if (bad(it.x) || it.x === undefined) it.x = 0;
    if (bad(it.y) || it.y === undefined) it.y = 0;
    for (const k of ['w', 'h', 'x2', 'y2', 'fontSize', 'angle', 'strokeWidth', 'opacity', 'r']) {
      if (bad(it[k])) delete it[k];
    }
    if (it.points !== undefined && (!Array.isArray(it.points) || it.points.some(p => !Array.isArray(p) || bad(p[0]) || bad(p[1])))) delete it.points;
    if (it.mids !== undefined && (!Array.isArray(it.mids) || it.mids.some(p => !Array.isArray(p) || bad(p[0]) || bad(p[1])))) delete it.mids;
    out.push(it);
  }
  s.items = out;
  return s;
}
function applyIncoming(s) {
  if (s && s.rev && s.rev < lastRev) return; // resposta lenta e desatualizada: descarta
  scene = sanitizeScene(s);
  pruneDanglingBinds();
  selIds = selIds.filter(id => scene.items.some(i => i.id === id));
  rebase(scene);
  draw();
}
function setStatus(txt) { saveEl.textContent = txt; }
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { liveEl.classList.add('on'); livetxt.textContent = 'ao vivo'; };
  es.onerror = () => { liveEl.classList.remove('on'); livetxt.textContent = 'reconectando…'; };
  es.addEventListener('scene', e => {
    const s = JSON.parse(e.data);
    if (busy()) { stale = true; return; }
    applyIncoming(s);
  });
}

/* ---------- imagens ---------- */
// Re-encode via canvas to WebP (mantém o board leve); cai para JPEG se o
// navegador não suportar WebP no toDataURL. Redimensiona para caber em maxDim.
function encodeImage(img, maxDim) {
  const w0 = img.naturalWidth || 1, h0 = img.naturalHeight || 1;
  const sc = Math.min(1, maxDim / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  off.getContext('2d').drawImage(img, 0, 0, w, h);
  let src = off.toDataURL('image/webp', 0.85);
  if (!src.startsWith('data:image/webp')) src = off.toDataURL('image/jpeg', 0.85);
  return { src, w, h };
}
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => resolve(encodeImage(im, 1400));
      im.onerror = () => reject(new Error('imagem inválida'));
      im.src = rd.result;
    };
    rd.onerror = () => reject(new Error('leitura falhou'));
    rd.readAsDataURL(file);
  });
}
// Insere N imagens de uma vez, em grade, re-encodadas em WebP.
async function addImageFiles(files, at) {
  const imgs = Array.from(files || []).filter(f => f && f.type && f.type.startsWith('image/'));
  if (!imgs.length) return;
  const decoded = [];
  for (const f of imgs) {
    try { decoded.push(await loadImageFile(f)); } catch { /* pula a que falhar */ }
  }
  if (!decoded.length) { setHint('não consegui ler essas imagens'); return; }
  pushUndo(JSON.stringify(scene.items));
  const cell = 480, gap = 24;
  const cols = Math.ceil(Math.sqrt(decoded.length));
  const rows = Math.ceil(decoded.length / cols);
  const baseX = at ? at[0] : s2wX(W / 2) - (cols * cell + (cols - 1) * gap) / 2;
  const baseY = at ? at[1] : s2wY(H / 2) - (rows * cell + (rows - 1) * gap) / 2;
  const newIds = [];
  decoded.forEach((d, i) => {
    const scale = cell / Math.max(d.w, d.h);
    const w = d.w * scale, h = d.h * scale;
    const col = i % cols, row = Math.floor(i / cols);
    const cx = baseX + col * (cell + gap), cy = baseY + row * (cell + gap);
    const it = { id: uid(), type: 'image', src: d.src, x: cx + (cell - w) / 2, y: cy + (cell - h) / 2, w, h, angle: 0, opacity: 100 };
    scene.items.push(it); newIds.push(it.id);
  });
  selIds = newIds;
  setTool('select');
  save(); draw(); refreshPanel();
  setHint(newIds.length + (newIds.length > 1 ? ' imagens inseridas (webp)' : ' imagem inserida (webp)'));
}
imgIn.addEventListener('change', () => {
  if (imgIn.files.length) addImageFiles(imgIn.files);
  imgIn.value = '';
});

/* ---------- ponteiro ---------- */
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function handleHit(sx, sy) {
  if (selIds.length > 1) {
    const gb = groupBoxOf(selIds);
    if (!gb) return null;
    const corners = [[gb.x, gb.y], [gb.x + gb.w, gb.y], [gb.x + gb.w, gb.y + gb.h], [gb.x, gb.y + gb.h]];
    for (let i = 0; i < 4; i++) {
      if (Math.abs(sx - w2sX(corners[i][0])) <= 7 && Math.abs(sy - w2sY(corners[i][1])) <= 7) return ['nw', 'ne', 'se', 'sw'][i];
    }
    return null;
  }
  if (selIds.length !== 1) return null;
  const it = scene.items.find(i => i.id === selIds[0]);
  if (!it) return null;
  if (it.type === 'line' || it.type === 'arrow') {
    const cp = curvePts(it);
    for (let i = 0; i < cp.length; i++) {
      if (Math.hypot(sx - w2sX(cp[i][0]), sy - w2sY(cp[i][1])) <= 8) return 'lp' + i;
    }
    return null;
  }
  if (!['rect', 'ellipse', 'diamond', 'image', 'draw', 'text'].includes(it.type)) return null;
  const pts = rotCorners(it).map(p => [w2sX(p[0]), w2sY(p[1])]);
  for (let i = 0; i < 4; i++) {
    if (Math.abs(sx - pts[i][0]) <= 7 && Math.abs(sy - pts[i][1]) <= 7) return ['nw', 'ne', 'se', 'sw'][i];

    if (mode === 'rotate' ? gesture.rotated : d >= 0.5) {
      pushPatch(gesture.before, subsetSnap(gesture.patchIds), gesture.patchIds);
      save();
    }
    if (mode === 'rotate') setHint(null);
  } else if (mode === 'erase') {
    pushUndo(gestureSnap);
    save();
  } else if (mode === 'marquee') {
    const [sxU, syU] = canvasPos(e);
    const dragged = Math.hypot(sxU - (gesture.sx0 ?? sxU), syU - (gesture.sy0 ?? syU)) >= 8;
    if (dragged) {
      selIds = expandGroup(marqueeCands);
    } else {
      selIds = [];
    }
    marquee = null;
    marqueeCands = [];
    refreshPanel();
  }
  mode = null;
  if (tool === 'hand') cv.style.cursor = 'grab';
  draw();
});

cv.addEventListener('pointercancel', () => {
  if (mode === 'create' && gesture.item) {
    scene.items = scene.items.filter(i => i.id !== gesture.item.id);
  } else if ((mode === 'move' || mode === 'resize' || mode === 'rotate' || mode === 'bend') && gesture.before) {
    applyPatchMap(gesture.before);
    selIds = selIds.filter(id => scene.items.some(i => i.id === id));
  }
  marquee = null;
  marqueeCands = [];
  mode = null;
  setHint(null);
  draw();
});

cv.addEventListener('dblclick', e => {
  const [sx, sy] = canvasPos(e);
  const wx = s2wX(sx), wy = s2wY(sy);
  const it = hitItem(wx, wy);
  if (it && it.type === 'text') {
    gestureSnap = JSON.stringify(scene.items);
    gesture = { newText: false };
    openEditor(it, false);
  } else if (!it) {
    gestureSnap = JSON.stringify(scene.items);
    const t = mkText('', wx, wy - 10, cur.fontSize);
    t.id = uid();
    t.opacity = cur.opacity;
    scene.items.push(t);

/* ---------- edição de texto ---------- */
function openEditor(it, isNew) {
  editingId = it.id;
  const b = textBox(it);
  ed.value = it.text;
  ed.style.display = 'block';
  ed.style.left = (w2sX(b.bx) - 2) + 'px';
  ed.style.top = (w2sY(b.by) - 2) + 'px';
  ed.style.fontFamily = fontOf(it.fontFamily);
  ed.style.fontSize = (it.fontSize * z) + 'px';
  ed.style.fontWeight = it.bold ? '700' : '400';
  ed.style.color = it.stroke;
  ed.style.width = Math.max(b.w * z + 20, 120) + 'px';
  ed.style.height = Math.max(b.h * z + 8, it.fontSize * z * 1.5) + 'px';
  ed.focus();
  ed.select();
}
function commitEditor() {
  const id = editingId;
  editingId = null;
  ed.style.display = 'none';
  const it = scene.items.find(i => i.id === id);
  if (!it) return;
  const val = ed.value.replace(/\n+$/, '');
  if (gesture.newText && !val.trim()) {
    scene.items = scene.items.filter(i => i.id !== it.id);
  } else if (val !== it.text) {
    it.text = val;
    ensureTextSize(it);
    pushUndo(gestureSnap);
    save();
  }
  if (gesture.viaTool && !lockTool) setTool('select');
  setHint(null);
  draw();
}
ed.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitEditor(); }
  if (e.key === 'Escape') { e.preventDefault(); commitEditor(); }
});
ed.addEventListener('blur', () => { if (editingId !== null) commitEditor(); });

/* ---------- área de transferência, ordem, alinhar ---------- */
function copySel() {
  clip = scene.items.filter(i => selIds.includes(i.id)).map(i => JSON.parse(JSON.stringify(i)));
  setHint(clip.length ? 'copiado' : null);
}
function pasteClip() {
  if (!clip.length) return;
  pushUndo(JSON.stringify(scene.items));
  const clones = clip.map(i => {
    const c = JSON.parse(JSON.stringify(i));
    c.id = uid();
    shiftItem(c, 16, 16);
    return c;
  });
  scene.items.push(...clones);
  selIds = clones.map(c => c.id);
  save(); draw(); refreshPanel();
}
function cutSel() {
  if (!selIds.length) return;
  copySel();
  pushUndo(JSON.stringify(scene.items));
  scene.items = scene.items.filter(i => !selIds.includes(i.id));
  selIds = [];
  save(); draw(); refreshPanel();
}
function duplicateSel() {
  if (!selIds.length) return;
  copySel();
  clip = clip.map(i => { const c = JSON.parse(JSON.stringify(i)); c.id = uid(); return c; });
  pasteClip();
}
function orderSel(dir) {
  if (!selIds.length) return;
  pushUndo(JSON.stringify(scene.items));
  const sel = scene.items.filter(i => selIds.includes(i.id));
  const rest = scene.items.filter(i => !selIds.includes(i.id));
  if (dir === 'front') scene.items = [...rest, ...sel];
  else if (dir === 'back') scene.items = [...sel, ...rest];
  else if (dir === 'fwd') {
    for (let i = scene.items.length - 2; i >= 0; i--) {
      if (selIds.includes(scene.items[i].id) && !selIds.includes(scene.items[i + 1].id)) {
        [scene.items[i], scene.items[i + 1]] = [scene.items[i + 1], scene.items[i]];
      }
    }
  } else {
    for (let i = 1; i < scene.items.length; i++) {
      if (selIds.includes(scene.items[i].id) && !selIds.includes(scene.items[i - 1].id)) {
        [scene.items[i], scene.items[i - 1]] = [scene.items[i - 1], scene.items[i]];
      }
    }
  }
  save(); draw();
}
function alignSel(dir) {
  if (!selIds.length) return;
  pushUndo(JSON.stringify(scene.items));
  const sel = scene.items.filter(i => selIds.includes(i.id));
  if ((dir === 'distH' || dir === 'distV') && sel.length >= 3) {
    const horiz = dir === 'distH';
    const boxes = sel.map(it => ({ it, b: rotAABB(it) }));
    boxes.sort((a, b2) => horiz ? (a.b.bx + a.b.w / 2) - (b2.b.bx + b2.b.w / 2) : (a.b.by + a.b.h / 2) - (b2.b.by + b2.b.h / 2));
    const first = boxes[0].b, last = boxes[boxes.length - 1].b;
    const c0 = horiz ? first.bx + first.w / 2 : first.by + first.h / 2;
    const c1 = horiz ? last.bx + last.w / 2 : last.by + last.h / 2;
    const step = (c1 - c0) / (boxes.length - 1);
    boxes.forEach((e, i) => {
      const b = e.b;
      const target = c0 + step * i;
      const cur2 = horiz ? b.bx + b.w / 2 : b.by + b.h / 2;
      shiftItem(e.it, horiz ? target - cur2 : 0, horiz ? 0 : target - cur2);
    });
  } else if (dir === 'distH' || dir === 'distV') {
    return; // distribuir pede 3+ itens
  } else {
    let box;
    if (sel.length === 1) {
      box = { bx: s2wX(0), by: s2wY(0), w: W / z, h: H / z };
    } else {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const it of sel) {
        const b = rotAABB(it);
        x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
        x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
      }
      box = { bx: x0, by: y0, w: x1 - x0, h: y1 - y0 };
    }
    for (const it of sel) {
      const b = rotAABB(it);
      let dx = 0, dy = 0;
      if (dir === 'left') dx = box.bx - b.bx;
      if (dir === 'hcenter') dx = box.bx + box.w / 2 - (b.bx + b.w / 2);
      if (dir === 'right') dx = box.bx + box.w - (b.bx + b.w);
      if (dir === 'top') dy = box.by - b.by;
      if (dir === 'vcenter') dy = box.by + box.h / 2 - (b.by + b.h / 2);
      if (dir === 'bottom') dy = box.by + box.h - (b.by + b.h);
      shiftItem(it, dx, dy);
    }
  }
  save(); draw();
}

/* ---------- teclado ---------- */
window.addEventListener('keydown', e => {
  if (e.target === ed || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  const mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === 'c') { e.preventDefault(); copySel(); return; }
  if (mod && k === 'x') { e.preventDefault(); cutSel(); return; }
  if (mod && k === 'v' && clip.length) { e.preventDefault(); pasteClip(); return; }
  if (mod && e.shiftKey && k === 'g') { e.preventDefault(); ungroupSel(); return; }
  if (mod && k === 'g') { e.preventDefault(); groupSel(); return; }
  if (mod && k === 'o') { e.preventDefault(); fileIn.click(); return; }
  if (mod && e.shiftKey && k === 'e') { e.preventDefault(); exportPng(); return; }
  if (mod && k === "'") { e.preventDefault(); toggleSnap(); return; }
  if (e.altKey && k === 'z') { e.preventDefault(); toggleZen(); return; }
  if (e.altKey && ['Minus', 'Equal', 'NumpadSubtract', 'NumpadAdd', 'NumpadEqual'].includes(e.code)) {
    e.preventDefault();
    const down = e.code === 'Minus' || e.code === 'NumpadSubtract';
    const first = scene.items.find(i => selIds.includes(i.id) && i.type === 'text');
    if (first) {
      const nf = Math.max(4, Math.round(((first.fontSize + (down ? -0.25 : 0.25)) * 100)) / 100);
      setStyle({ fontSize: nf });
      setHint(`fonte ${nf}px`);
    }
    return;
  }
  if (mod && e.key === 'ArrowUp') { e.preventDefault(); createFlowDir('up'); return; }
  if (mod && e.key === 'ArrowDown') { e.preventDefault(); createFlowDir('down'); return; }
  if (mod && e.key === 'ArrowLeft') { e.preventDefault(); createFlowDir('left'); return; }
  if (mod && e.key === 'ArrowRight') { e.preventDefault(); createFlowDir('right'); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selIds.length) {
      pushUndo(JSON.stringify(scene.items));
      dropBindingsTo(selIds);
      scene.items = scene.items.filter(i => !selIds.includes(i.id));
      selIds = [];
      save(); draw(); refreshPanel();
    }
    return;
  }
  if (mod && e.key === 'Enter') { e.preventDefault(); createFlow(); return; }
  if (e.key === 'Enter' && selIds.length === 1) {
    const it = scene.items.find(i => i.id === selIds[0]);
    if (it && it.type === 'text') {
      e.preventDefault();
      gestureSnap = JSON.stringify(scene.items);
      gesture = { newText: false };
      openEditor(it, false);
      return;
    }
  }
  if (e.key.startsWith('Arrow') && selIds.length && !mod && !e.altKey) {
    e.preventDefault();
    pushUndo(JSON.stringify(scene.items));
    const d = e.shiftKey ? 10 : 1;
    const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
    const dy = e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0;
    for (const id of selIds) {
      const it = scene.items.find(i => i.id === id);
      if (it) shiftItem(it, dx, dy);
    }
    save(); draw();
    return;
  }
  if (e.key === '!' || (e.shiftKey && e.key === '1')) { zoomToFit(); return; }
  if (e.key === 'Escape') {
    if (cpick.classList.contains('open')) { closeCpick(); return; }
    if (bdlg.classList.contains('open')) { bdlg.classList.remove('open'); return; }
    if (document.getElementById('help').classList.contains('open')) { toggleHelp(); return; }
    if (zen) { toggleZen(); return; }
    selIds = []; marquee = null; setStamp(null); setTool('select'); draw(); refreshPanel(); return;
  }
  if (e.key === '?' || (e.shiftKey && k === '/')) { toggleHelp(); return; }
  if (e.key === '+' || e.key === '=') { zoomAt(W / 2, H / 2, 1.2); return; }
  if (e.key === '-') { zoomAt(W / 2, H / 2, 1 / 1.2); return; }
  if (k === ']') { orderSel('front'); return; }
  if (k === '[') { orderSel('back'); return; }
  if (k === 'q' && !mod && !e.altKey) { setLock(!lockTool); return; }
  const digits = { 1: 'select', 2: 'rect', 3: 'diamond', 4: 'ellipse', 5: 'arrow', 6: 'line', 7: 'draw', 8: 'text', 9: 'image', 0: 'erase' };
  if (digits[e.key]) { digitTool(digits[e.key]); return; }
  const tools = { v: 'select', r: 'rect', o: 'ellipse', l: 'line', a: 'arrow', t: 'text', e: 'erase', d: 'draw', h: 'hand' };
  if (tools[k] && !mod && !e.altKey) setTool(tools[k]);
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceDown = false;
    if (tool === 'hand') cv.style.cursor = 'grab';
    else if (tool === 'select') cv.style.cursor = 'default';
  }
});
function digitTool(id) {
  if (id === 'image') { imgIn.click(); return; }
  setTool(id);
}

/* ---------- colar: imagem, JSON de outro quadro ou interno ---------- */
function importForeignClipboard(ex) {
  if (!looksForeign(ex)) return false;
  const conv = fromForeign(ex);
  if (!conv.items.length) return false;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of conv.items) {
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  const cx = s2wX(W / 2) - (x0 + x1) / 2, cy = s2wY(H / 2) - (y0 + y1) / 2;
  pushUndo(JSON.stringify(scene.items));
  for (const it of conv.items) {
    it.id = uid();
    shiftItem(it, cx, cy);
    scene.items.push(it);
  }
  selIds = conv.items.map(i => i.id);
  setTool('select');
  save(); draw(); refreshPanel();
  setHint('colado de outro quadro: ' + conv.items.length + ' itens');
  return true;
}
document.addEventListener('paste', e => {
  if (e.target === ed) return;
  const cd = e.clipboardData;
  const tryForeign = raw => {
    if (!raw || !raw.includes('"elements"')) return false;
    try { return importForeignClipboard(JSON.parse(raw)); } catch { return false; }
  };
  if (cd) {
    const foreignJson = cd.getData('application/vnd.excalidraw+json') || '';
    if (tryForeign(foreignJson)) { e.preventDefault(); return; }
    const txt = cd.getData('text/plain') || '';
    if (tryForeign(txt)) { e.preventDefault(); return; }
    // imagens do clipboard (colado de outra aba/app): pega todas, não só a primeira
    const pasted = [];
    for (const f of cd.files || []) if (f.type.startsWith('image/')) pasted.push(f);
    for (const item of cd.items || []) {
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        const f = item.getAsFile();
        if (f && !pasted.includes(f)) pasted.push(f);
      }
    }
    if (pasted.length) { e.preventDefault(); addImageFiles(pasted); return; }
  }
});
cv.addEventListener('dragover', e => e.preventDefault());
cv.addEventListener('drop', e => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer?.files || []);
  if (!files.length) return;
  const [sx, sy] = canvasPos(e);
  const images = files.filter(f => f.type && f.type.startsWith('image/'));
  if (images.length) { addImageFiles(images, [s2wX(sx), s2wY(sy)]); return; }
  const board = files.find(f => f.name.endsWith('.drawrdis') || f.name.endsWith('.excalidraw') || f.name.endsWith('.json') || f.type === 'application/json');
  if (board) loadFileObject(board);
});

/* ---------- roda / zoom ---------- */
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const [sx, sy] = canvasPos(e);
  if (e.ctrlKey || e.metaKey) {
    zoomAt(sx, sy, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  } else {
    panX -= e.deltaX;
    panY -= e.deltaY;
    draw();
  }
}, { passive: false });

function zoomAt(sx, sy, f) {
  const wx = s2wX(sx), wy = s2wY(sy);
  z = Math.max(0.1, Math.min(4, z * f));
  if (!isFinite(z)) z = 1; // safety net
  panX = sx - wx * z;
  panY = sy - wy * z;
  zoomLbl.textContent = (Number.isFinite(z) ? Math.round(z * 100) : 100) + '%';
  draw();
}
function zoomToFit() {
  if (!scene.items.length) { z = 1; panX = 60; panY = 80; zoomLbl.textContent = '100%'; draw(); return; }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of scene.items) {
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  const usableW = W - 250;
  const dw = x1 - x0 || 1; // guard against zero-width (prevents NaN)
  const dh = y1 - y0 || 1; // guard against zero-height (prevents NaN)
  z = Math.max(0.1, Math.min(1.5, Math.min(usableW / dw, (H - 120) / dh)));
  if (!isFinite(z)) z = 1; // final safety net
  panX = (usableW - dw * z) / 2 - x0 * z;
  panY = (H - dh * z) / 2 - y0 * z;
  zoomLbl.textContent = (Number.isFinite(z) ? Math.round(z * 100) : 100) + '%';
  draw();
}

/* ---------- exportar / importar ---------- */
function exportPng() {
  if (!scene.items.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of scene.items) {
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  const pad = 40, scale = 2;
  const off = document.createElement('canvas');
  off.width = Math.round((x1 - x0 + pad * 2) * scale);
  off.height = Math.round((y1 - y0 + pad * 2) * scale);
  const g = off.getContext('2d');
  g.fillStyle = scene.bg || (document.body.dataset.theme === 'dark' ? '#131316' : '#ffffff');
  g.fillRect(0, 0, off.width, off.height);
  g.scale(scale, scale);
  g.translate(pad - x0, pad - y0);
  drawItems(g, false);
  const a = document.createElement('a');
  a.href = off.toDataURL('image/png');
  a.download = 'drawrdis.png';
  a.click();
}
/* ---------- quadros salvos ---------- */
const bdlg = document.getElementById('bdlg');
function openBoards() {
  menuEl.classList.remove('open');
  renderBoards();
  bdlg.classList.add('open');
  bdlg.style.left = Math.max(8, W / 2 - 134) + 'px';
  bdlg.style.top = '72px';
}

async function newBoard() {
  if (!confirm('Criar novo quadro? O quadro atual será salvo como backup.')) return;
  const name = 'backup ' + new Date().toLocaleString('pt-BR');
  try {
    const r = await fetch('/boards', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name, scene }),
    });
    if (!r.ok) throw new Error('http ' + r.status);
  } catch {
    setHint('não consegui salvar o backup; quadro NÃO foi limpo');
    return;
  }
  pushUndo(JSON.stringify(scene.items));
  scene = { version: 1, title: 'Novo quadro', items: [] };
  selIds = [];
  save();
  zoomToFit();
  refreshPanel();
  draw();
  setHint('Novo quadro criado — backup em "Quadros salvos", Ctrl+Z volta ao anterior');
}

async function renderBoards() {
  bdlg.innerHTML = '';
  el('h5', { textContent: 'Quadros salvos' }, bdlg);
  const row = el('div', { className: 'brow' }, bdlg);
  const inp = el('input', { type: 'text', placeholder: 'nome do quadro…', maxLength: 60 }, row);
  const btn = el('button', { textContent: 'Salvar', title: 'Salva o quadro atual com esse nome' }, row);
  btn.style.cssText = 'border-radius:8px;background:var(--accent2);color:var(--accent);font-weight:600;padding:7px 12px;';
  const list = el('div', { className: 'blist' }, bdlg);
  const hint = el('div', { className: 'bhint', textContent: 'Abrir substitui o quadro atual (Ctrl+Z desfaz). O quadro atual continua salvando sozinho enquanto você desenha.' }, bdlg);
  btn.onclick = async () => {
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    await fetch('/boards', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, scene }) });
    setHint(`quadro "${name}" salvo`);
    inp.value = '';
    renderBoards();
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') btn.click();
    if (e.key === 'Escape') bdlg.classList.remove('open');
  });
  try {
    const boards = await (await fetch('/boards')).json();
    if (!boards.length) {
      el('div', { className: 'bempty', textContent: 'nenhum quadro salvo ainda' }, list);
      return;
    }
    for (const b of boards) {
      const item = el('div', { className: 'bitem' }, list);
      const meta = el('div', { className: 'bmeta' }, item);
      el('div', { className: 'bname', textContent: b.title }, meta);
      el('div', { className: 'bsub', textContent: `${b.items} itens · ${new Date(b.date).toLocaleDateString('pt-BR')} ${new Date(b.date).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` }, meta);
      const open = el('button', { textContent: 'Abrir', title: 'Abrir este quadro' }, item);
      open.onclick = async () => {
        const sc = await (await fetch('/boards/' + b.file)).json();
        pushUndo(JSON.stringify(scene.items));
        scene = { version: 1, title: sc.title || scene.title, bg: sc.bg || null, bgMode: sc.bgMode, items: sc.items };
        selIds = [];
        save();
        zoomToFit(); refreshPanel(); markBgMode();
        bdlg.classList.remove('open');
        setHint(`quadro "${b.title}" aberto — Ctrl+Z volta ao anterior`);
      };
      const del = el('button', { textContent: '×', title: 'Excluir quadro salvo' }, item);
      del.onclick = async () => {
        await fetch('/boards/' + b.file, { method: 'DELETE' });
        renderBoards();
      };

function hexToRgb(h) {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(h)) return null;
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(c) {
  return '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}
function shade(hex, f) {
  const c = hexToRgb(hex);
  if (!c) return hex;
  const t = f > 0 ? 255 : 0;
  return rgbToHex(c.map(v => v + (t - v) * Math.abs(f)));
}

/* ---------- fluxo: Ctrl+setas clona o elemento na direção e liga ---------- */
function createFlowDir(dir) {
  if (!selIds.length) { setHint('selecione um elemento e use Ctrl+setas'); return; }
  pushUndo(JSON.stringify(scene.items));
  const sel = scene.items.filter(i => selIds.includes(i.id));
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const it of sel) {
    const b = rotAABB(it);
    x0 = Math.min(x0, b.bx); y0 = Math.min(y0, b.by);
    x1 = Math.max(x1, b.bx + b.w); y1 = Math.max(y1, b.by + b.h);
  }
  const gap = 140;
  const dx = dir === 'right' ? (x1 - x0) + gap : dir === 'left' ? -((x1 - x0) + gap) : 0;
  const dy = dir === 'down' ? (y1 - y0) + gap : dir === 'up' ? -((y1 - y0) + gap) : 0;
  const map = new Map();
  const clones = [];
  for (const s of sel) {
    const c = JSON.parse(JSON.stringify(s));
    c.id = uid();
    shiftItem(c, dx, dy);
    clones.push(c);
    map.set(s.id, c);
  }
  for (const c of clones) {
    if (c.startBind && map.has(c.startBind.id)) c.startBind.id = map.get(c.startBind.id).id;
    if (c.endBind && map.has(c.endBind.id)) c.endBind.id = map.get(c.endBind.id).id;
  }
  const primary = sel[0];
  const counter = map.get(primary.id);
  const pcx = (x0 + x1) / 2, pcy = (y0 + y1) / 2;
  scene.items.push(...clones, {
    id: uid(), type: 'arrow',
    x: pcx, y: pcy, x2: pcx + dx, y2: pcy + dy,
    stroke: cur.stroke, strokeWidth: 2, fill: 'transparent',
    strokeStyle: 'solid', roughness: 1, opacity: 100,
    startBind: { id: primary.id }, endBind: { id: counter.id },
  });
  selIds = [counter.id];
  setTool('select');
  save(); draw(); refreshPanel();
  setHint('fluxo criado ' + ({ up: 'acima', down: 'abaixo', left: 'à esquerda', right: 'à direita' })[dir]);
}
/* ---------- fluxo: Ctrl+Enter clona a tela e liga com seta ---------- */
function createFlow() {
  const sel = scene.items.find(i => i.id === selIds[0]);
  if (!sel) { setHint('selecione um elemento pra criar o fluxo'); return; }
  const sb = rotAABB(sel);
  let frame = null, fb = null;
  for (const it of scene.items) {
    if (it.type !== 'rect' || it.id === sel.id) continue;
    if (it.w < 80 || it.h < 80) continue;
    const b = rotAABB(it);
    if (b.bx - 2 <= sb.bx && b.by - 2 <= sb.by && b.bx + b.w + 2 >= sb.bx + sb.w && b.by + b.h + 2 >= sb.by + sb.h) {
      if (!frame || b.w * b.h < fb.w * fb.h) { frame = it; fb = b; }
    }
  }
  pushUndo(JSON.stringify(scene.items));
  const srcs = [];
  if (frame) {
    srcs.push(frame);
    for (const it of scene.items) {
      if (it.id === frame.id) continue;
      const b = rotAABB(it);
      if (b.bx >= fb.bx - 2 && b.by >= fb.by - 2 && b.bx + b.w <= fb.bx + fb.w + 2 && b.by + b.h <= fb.by + fb.h + 2) srcs.push(it);
    }
  } else {
    srcs.push(sel);
  }
  const dx = Math.round((frame ? fb.w : sb.w) + 160);
  const clones = [];
  const map = new Map();
  for (const s of srcs) {
    const c = JSON.parse(JSON.stringify(s));
    c.id = uid();
    c._src = s.id;
    shiftItem(c, dx, 0);
    clones.push(c);
    map.set(s.id, c);
  }
  for (const c of clones) {
    if (c.startBind && map.has(c.startBind.id)) c.startBind.id = map.get(c.startBind.id).id;
    if (c.endBind && map.has(c.endBind.id)) c.endBind.id = map.get(c.endBind.id).id;
  }
  const counterpart = map.get(sel.id) || clones[0];
  scene.items.push(...clones);
  const arrow = {
    id: uid(), type: 'arrow',
    x: sb.bx + sb.w, y: sb.by + sb.h / 2,
    x2: sb.bx + sb.w + dx, y2: sb.by + sb.h / 2,
    stroke: cur.stroke, strokeWidth: 2, fill: 'transparent',
    strokeStyle: 'solid', roughness: 1, opacity: 100,
    startBind: { id: sel.id }, endBind: { id: counterpart.id },
  };
  scene.items.push(arrow);
  for (const c of clones) delete c._src;
  selIds = [counterpart.id];
  setTool('select');
  save(); draw(); refreshPanel();
  setHint('fluxo criado — a tela nova está ligada por seta');
}
function selFirst() {
  return scene.items.find(i => i.id === selIds[0]);
}
function panelKind() {
  if (selIds.length) {
    const it = selFirst();
    if (!it) return null;
    if (it.type === 'text') return 'text';
    if (it.type === 'image') return 'image';
    if (['line', 'arrow', 'draw'].includes(it.type)) return 'line';
    return 'shape';
  }
  if (stampMode) return 'shape';
  return TOOL_KIND[tool] || null;
}
function refreshPanel() {
  const kind = panelKind();
  const show = !!kind && !zen;
  panelEl.classList.toggle('show', show);
  if (!show) return;
  const it = selFirst();
  for (const s of panelEl.querySelectorAll('.sec')) {
    s.classList.toggle('off', !s.dataset.kinds.includes(kind));
  }
  panel.ptitle.textContent = it
    ? (TYPE_LABEL[it.type] || 'Item') + (selIds.length > 1 ? ` +${selIds.length - 1}` : '')
    : TYPE_LABEL[tool === 'text' ? 'text' : tool] || 'Estilo';
  panel.pcount.textContent = it ? `${selIds.length} selecionado${selIds.length > 1 ? 's' : ''}` : '';

  const eff = it ? {
    stroke: it.stroke, fill: it.fill, fillStyle: it.fillStyle ?? 'solid',
    strokeWidth: it.strokeWidth ?? 2, strokeStyle: it.strokeStyle ?? 'solid',
    roughness: it.roughness ?? 0, opacity: it.opacity ?? 100,
    fontFamily: it.fontFamily, fontSize: it.fontSize, textAlign: it.textAlign, bold: it.bold,
    r: it.type === 'rect' ? it.r : null,
  } : cur;

  for (const [c, b] of Object.entries(panel.strokeBtns)) b.classList.toggle('on', c === eff.stroke);
  panel.strokeCustom.style.background = /^#([0-9a-f]{6})$/i.test(eff.stroke) ? eff.stroke : 'repeating-linear-gradient(45deg,#fff,#fff 3px,#ddd 3px,#ddd 6px)';
  panel.strokeCustom.classList.toggle('on', !STROKES.includes(eff.stroke) && /^#([0-9a-f]{6})$/i.test(eff.stroke));
  const hasFill = kind === 'shape';
  const noFill = eff.fill === 'transparent' || !hasFill;
  for (const [c, b] of Object.entries(panel.fillBtns)) {
    b.classList.toggle('on', hasFill && c === eff.fill);
    b.disabled = !hasFill;
  }
  panel.fillCustom.style.background = /^#([0-9a-f]{6})$/i.test(eff.fill)
    ? eff.fill
    : 'repeating-linear-gradient(45deg,#fff,#fff 3px,#ddd 3px,#ddd 6px)';
  panel.fillCustom.classList.toggle('on', hasFill && !FILLS.includes(eff.fill) && /^#([0-9a-f]{6})$/i.test(eff.fill));
  panel.fillCustom.disabled = !hasFill;
  for (const b of Object.values(panel.fillStyle)) b.disabled = noFill;
  markSeg(panel.fillStyle, noFill ? '—' : (eff.fillStyle ?? 'solid'));
  markSeg(panel.strokeWidth, String(eff.strokeWidth ?? 2));
  markSeg(panel.strokeStyle, eff.strokeStyle ?? 'solid');
  markSeg(panel.roughness, String(eff.roughness ?? 0));
  markSeg(panel.edges, eff.r === null || eff.r === undefined ? '—' : (eff.r >= 5 ? '32' : '0'));
  if (kind === 'text') {
    markSeg(panel.fontFamily, eff.fontFamily || 'hand');
    markSeg(panel.fontSize, String(eff.fontSize || 20));
    markSeg(panel.textAlign, eff.textAlign || 'left');
    panel.bold.classList.toggle('on', !!eff.bold);
  }
  panel.opacity.value = String(eff.opacity ?? 100);
  const hasSel = selIds.length > 0;
  [panel.toFront, panel.toBack, panel.fwd, panel.bwd].forEach(b => b.disabled = !hasSel);

}
function markSeg(btns, val) {
  for (const [v, b] of Object.entries(btns)) b.classList.toggle('on', v === String(val));
}
function setStyle(patch) {
  Object.assign(cur, patch);
  const targets = scene.items.filter(i => selIds.includes(i.id));
  if (targets.length) pushUndo(JSON.stringify(scene.items));
  for (const it of targets) {
    if ('stroke' in patch) it.stroke = patch.stroke;
    if ('fill' in patch && ['rect', 'ellipse', 'diamond'].includes(it.type)) it.fill = patch.fill;
    if ('fillStyle' in patch && ['rect', 'ellipse', 'diamond'].includes(it.type)) it.fillStyle = patch.fillStyle;
    if ('strokeWidth' in patch) it.strokeWidth = patch.strokeWidth;
    if ('strokeStyle' in patch) it.strokeStyle = patch.strokeStyle;
    if ('roughness' in patch && it.type !== 'image') it.roughness = patch.roughness;
    if ('opacity' in patch) it.opacity = patch.opacity;
    if ('r' in patch && it.type === 'rect') it.r = patch.r;
    if ('fontFamily' in patch && it.type === 'text') it.fontFamily = patch.fontFamily;
    if ('fontSize' in patch && it.type === 'text') it.fontSize = patch.fontSize;
    if ('textAlign' in patch && it.type === 'text') it.textAlign = patch.textAlign;
    if ('bold' in patch && it.type === 'text') it.bold = patch.bold;
  }
  if (targets.length) save();
  refreshPanel();
  draw();
}

function resize() {

  cv.style.width = W + 'px';

}

    for (const it of scene.items) { const b = rotAABB(it); maxX = Math.max(maxX, b.bx + b.w); minY = Math.min(minY, b.by); }
    setTool('rect');
    pd(w2sX(maxX + 200), w2sY(minY)); pm(w2sX(maxX + 280), w2sY(minY + 60)); pu(w2sX(maxX + 280), w2sY(minY + 60));
    setTool('rect');
    pd(w2sX(maxX + 500), w2sY(minY)); pm(w2sX(maxX + 580), w2sY(minY + 60)); pu(w2sX(maxX + 580), w2sY(minY + 60));
    await sleep(20);
    const mq = scene.items.filter(i => i.type === 'rect').slice(-2);
    setTool('select');
    selIds = [];
    pd(w2sX(maxX + 140), w2sY(minY - 60)); pm(w2sX(maxX + 360), w2sY(minY + 30)); pm(w2sX(maxX + 640), w2sY(minY + 120)); pu(w2sX(maxX + 640), w2sY(minY + 120));
    await sleep(20);
    log('marquee: arrasto seleciona os 2 retângulos', selIds.includes(mq[0].id) && selIds.includes(mq[1].id) && selIds.length === 2, `sel=${selIds.length}`);

    pd(w2sX(maxX + 140), w2sY(minY - 60)); pm(w2sX(maxX + 140) + 4, w2sY(minY - 60) + 3); pu(w2sX(maxX + 140) + 4, w2sY(minY - 60) + 3);
    await sleep(20);
    log('marquee: micro-arrasto não seleciona', selIds.length === 0, `sel=${selIds.length}`);

    selIds = [B.id];
    const nBefore = scene.items.length;
    const yB = rotAABB(B).by;
    key('ArrowUp', { ctrlKey: true });
    await sleep(30);
    const upArrow = scene.items.filter(i => i.type === 'arrow').pop();
    const upClone = upArrow && scene.items.find(i => i.id === upArrow.endBind?.id);
    log('fluxo: Ctrl+↑ clona só o elemento acima', scene.items.length === nBefore + 2 && upClone && upClone.type === 'rect' && rotAABB(upClone).by < yB, `+${scene.items.length - nBefore} itens, y ${upClone ? rotAABB(upClone).by.toFixed(0) : '?'} < ${yB.toFixed(0)}`);

    selIds = [B.id];
    key('c', { ctrlKey: true });
    const nCopy = scene.items.length;
    key('v', { ctrlKey: true });
    await sleep(20);
    const pastedR = scene.items.filter(i => i.type === 'rect').pop();
    log('copiar/colar: Ctrl+C/V duplica seleção', scene.items.length === nCopy + 1 && selIds.length === 1 && pastedR.id !== B.id, `+1, sel=${selIds.length}`);

    const fBefore = tw.fontSize;
    selIds = [tw.id];
    window.dispatchEvent(new KeyboardEvent('keydown', { key: '-', code: 'Minus', altKey: true, bubbles: true, cancelable: true }));
    window.dispatchEvent(new KeyboardEvent('keydown', { key: '-', code: 'Minus', altKey: true, bubbles: true, cancelable: true }));
    await sleep(20);
    const twA = scene.items.find(i => i.id === tw.id);
    log('fonte: Alt+- reduz 0,25 por toque', Math.abs((fBefore - twA.fontSize) - 0.5) < 0.01, `${fBefore}→${twA.fontSize}`);

    await fetch('/boards', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: 'harness teste', scene: { version: 1, title: 'harness teste', items: [{ id: 'hb1', type: 'rect', x: 0, y: 0, w: 50, h: 30 }] } }) });
    const blist = await (await fetch('/boards')).json();
    const saved = blist.find(b => b.file === 'harness-teste');
    log('quadros: salvar e listar', !!saved && saved.items === 1, saved ? `${saved.title} (${saved.items} itens)` : 'não listou');
    const opened = await (await fetch('/boards/harness-teste')).json();
    log('quadros: abrir retorna a cena', opened.items.length === 1 && opened.items[0].id === 'hb1', '');
    await fetch('/boards/harness-teste', { method: 'DELETE' });
    const blist2 = await (await fetch('/boards')).json();
    log('quadros: excluir remove da lista', !blist2.some(b => b.file === 'harness-teste'), '');

    key('1', { shiftKey: true });
    await sleep(20);
    log('shift+1 enquadra', z >= 0.099 && z <= 4, `z=${z.toFixed(2)}`);

    toggleSnap(); toggleSnap();
    toggleZen(); toggleZen();
    toggleTheme(); toggleTheme();
    log('toggles: snap/zen/tema sem erro', true, '');

    // agrupar/desagrupar: mover e redimensionar o grupo junto
    {
      scene.items = scene.items.filter(i => !/^grp/.test(i.id));
      scene.items.push(
        { id: 'grpa', type: 'rect', x: 2000, y: 2000, w: 40, h: 40, stroke: '#1b1b1f', strokeWidth: 2, roughness: 1 },
        { id: 'grpb', type: 'rect', x: 2060, y: 2000, w: 40, h: 40, stroke: '#1b1b1f', strokeWidth: 2, roughness: 1 },
      );
      setTool('select'); selIds = ['grpa', 'grpb']; groupSel();
      const gA = scene.items.find(i => i.id === 'grpa'), gB = scene.items.find(i => i.id === 'grpb');
      log('grupo: Ctrl+G marca os dois com o mesmo g', !!gA.g && gA.g === gB.g, gA.g);
      log('grupo: expandGroup pega o irmão', expandGroup(['grpa']).length === 2, '');
      // clicar em um membro seleciona o grupo inteiro (zoom 1, grupo centralizado)
      z = 1; panX = W / 2 - 2050; panY = H / 2 - 2020; draw(); await sleep(20);
      selIds = []; draw();
      const ca = { x: 2020, y: 2020 };
      pd(w2sX(ca.x), w2sY(ca.y)); pu(w2sX(ca.x), w2sY(ca.y)); await sleep(20);
      log('grupo: clique num membro pega os 2', selIds.length === 2 && selIds.includes('grpa') && selIds.includes('grpb'), 'sel=' + selIds.join(','));
      // mover o grupo
      const before = { a: scene.items.find(i => i.id === 'grpa').x, b: scene.items.find(i => i.id === 'grpb').x };
      pd(w2sX(ca.x), w2sY(ca.y)); pm(w2sX(ca.x) + 80, w2sY(ca.y)); pu(w2sX(ca.x) + 80, w2sY(ca.y)); await sleep(30);
      const mA = scene.items.find(i => i.id === 'grpa'), mB = scene.items.find(i => i.id === 'grpb');
      log('grupo: mover arrasta os dois juntos', Math.abs((mA.x - before.a) - (mB.x - before.b)) < 2 && mA.x > before.a, `dA=${(mA.x - before.a).toFixed(0)} dB=${(mB.x - before.b).toFixed(0)}`);
      // redimensionar o grupo pela alça SE
      const gb = groupBoxOf(['grpa', 'grpb']);
      const wa0 = scene.items.find(i => i.id === 'grpa').w;
      const se = { x: gb.x + gb.w, y: gb.y + gb.h };
      pd(w2sX(se.x), w2sY(se.y)); pm(w2sX(se.x) + 60, w2sY(se.y) + 60); pu(w2sX(se.x) + 60, w2sY(se.y) + 60); await sleep(30);
      const rA = scene.items.find(i => i.id === 'grpa');
      log('grupo: redimensionar escala os dois', rA.w > wa0 + 1, `w ${wa0.toFixed(0)}→${rA.w.toFixed(0)}`);
      selIds = ['grpa', 'grpb']; ungroupSel();
      log('grupo: Ctrl+Shift+G limpa o g', scene.items.filter(i => /^grp/.test(i.id)).every(i => !i.g), '');
      scene.items = scene.items.filter(i => !/^grp/.test(i.id)); selIds = []; save(); draw();
    }

    // escrita concorrente: o agente escreve enquanto o editor tem mudança
    // pendente; o save por diff não pode apagar o item do agente
    {
      await sleep(400); // deixa o save pendente dos toggles completar antes
      const ag = { id: 'ag-conc', type: 'rect', x: 1500, y: 1500, w: 40, h: 40 };
      const mine = { id: 'hm-conc', type: 'rect', x: 1560, y: 1500, w: 40, h: 40 };
      scene.items.push(mine);
      dirty = true; // editor "ocupado": o SSE do agente vira stale, não apply
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ add: [ag] }) });
      await sleep(60);
      await doSave(); // nosso save manda só hm-conc; ag-conc não está no nosso diff
      const merged = await (await fetch('/scene')).json();
      log('concorrência: agente e humano sobrevivem juntos', merged.items.some(i => i.id === 'ag-conc') && merged.items.some(i => i.id === 'hm-conc'), '');
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ remove: ['ag-conc', 'hm-conc'] }) });
      await sleep(500);
      if (scene.items.some(i => i.id === 'ag-conc' || i.id === 'hm-conc')) {
        applyIncoming(await (await fetch('/scene')).json()); // SSE caiu em stale; reconcilia
      }
    }

    // zoom não quebra com board degenerado nem com item corrompido (NaN)
    {
      const keep = scene;
      scene = { version: 1, items: [{ id: 'degen', type: 'rect', x: 100, y: 100, w: 0, h: 0 }] };
      zoomToFit();
      log('zoom: bbox degenerada não gera NaN', Number.isFinite(z) && z > 0 && !/NaN/.test(zoomLbl.textContent), `z=${z}`);
      applyIncoming({ version: 1, rev: (lastRev || 0) + 1, items: [
        { id: 'ok1', type: 'rect', x: 0, y: 0, w: 50, h: 50 },
        { id: 'bad1', type: 'rect', x: NaN, y: 0, w: 50, h: 50 },
        { id: 'fr1', type: 'frame', x: 10, y: 10, w: 40, h: 40 },
      ] });
      const b1 = scene.items.find(i => i.id === 'bad1');
      const fr = scene.items.find(i => i.id === 'fr1');
      log('sanitize: NaN→0, frame→rect, zoom íntegro', b1 && b1.x === 0 && fr && fr.type === 'rect' && Number.isFinite(z), '');
      scene = keep; rebase(keep); draw();
    }

    await sleep(700);
    const persisted = await (await fetch('/scene')).json();
    log('persistência: board salvo via HTTP', Array.isArray(persisted.items) && persisted.items.length === scene.items.length, `http=${persisted.items.length} local=${scene.items.length}`);
  } catch (err) {
    log('exceção no harness', false, err.message + ' @ ' + err.stack?.split('\n')[0]);
  }
  clearTimeout(saveTimer);
  dirty = false;
  await fetch('/scene', { method: 'POST', headers: { 'content-type': 'application/json' }, body: boardSnapshot });
  await new Promise(r => setTimeout(r, 500));
  out.textContent += '\nFIM';
}

</script>
