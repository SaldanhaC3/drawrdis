    const opened = await (await fetch('/boards/harness-teste')).json();
    log('quadros: abrir retorna a cena', opened.items.length === 1 && opened.items[0].id === 'hb1', '');
    await fetch('/boards/harness-teste', { method: 'DELETE' });
    const blist2 = await (await fetch('/boards')).json();
    log('quadros: excluir remove da lista', !blist2.some(b => b.file === 'harness-teste'), '');

    key('1', { shiftKey: true });
    await sleep(20);
    log('shift+1 enquadra', z >= 0.099 && z <= 4, `z=${z.toFixed(2)}`);

    toggleSnap(); toggleSnap();
    toggleZen(); toggleZen();
    toggleTheme(); toggleTheme();
    log('toggles: snap/zen/tema sem erro', true, '');

    // agrupar/desagrupar: mover e redimensionar o grupo junto
    {
      scene.items = scene.items.filter(i => !/^grp/.test(i.id));
      scene.items.push(
        { id: 'grpa', type: 'rect', x: 2000, y: 2000, w: 40, h: 40, stroke: '#1b1b1f', strokeWidth: 2, roughness: 1 },
        { id: 'grpb', type: 'rect', x: 2060, y: 2000, w: 40, h: 40, stroke: '#1b1b1f', strokeWidth: 2, roughness: 1 },
      );
      setTool('select'); selIds = ['grpa', 'grpb']; groupSel();
      const gA = scene.items.find(i => i.id === 'grpa'), gB = scene.items.find(i => i.id === 'grpb');
      log('grupo: Ctrl+G marca os dois com o mesmo g', !!gA.g && gA.g === gB.g, gA.g);
      log('grupo: expandGroup pega o irmão', expandGroup(['grpa']).length === 2, '');
      // clicar em um membro seleciona o grupo inteiro (zoom 1, grupo centralizado)
      z = 1; panX = W / 2 - 2050; panY = H / 2 - 2020; draw(); await sleep(20);
      selIds = []; draw();
      const ca = { x: 2020, y: 2020 };
      pd(w2sX(ca.x), w2sY(ca.y)); pu(w2sX(ca.x), w2sY(ca.y)); await sleep(20);
      log('grupo: clique num membro pega os 2', selIds.length === 2 && selIds.includes('grpa') && selIds.includes('grpb'), 'sel=' + selIds.join(','));
      // mover o grupo
      const before = { a: scene.items.find(i => i.id === 'grpa').x, b: scene.items.find(i => i.id === 'grpb').x };
      pd(w2sX(ca.x), w2sY(ca.y)); pm(w2sX(ca.x) + 80, w2sY(ca.y)); pu(w2sX(ca.x) + 80, w2sY(ca.y)); await sleep(30);
      const mA = scene.items.find(i => i.id === 'grpa'), mB = scene.items.find(i => i.id === 'grpb');
      log('grupo: mover arrasta os dois juntos', Math.abs((mA.x - before.a) - (mB.x - before.b)) < 2 && mA.x > before.a, `dA=${(mA.x - before.a).toFixed(0)} dB=${(mB.x - before.b).toFixed(0)}`);
      // redimensionar o grupo pela alça SE
      const gb = groupBoxOf(['grpa', 'grpb']);
      const wa0 = scene.items.find(i => i.id === 'grpa').w;
      const se = { x: gb.x + gb.w, y: gb.y + gb.h };
      pd(w2sX(se.x), w2sY(se.y)); pm(w2sX(se.x) + 60, w2sY(se.y) + 60); pu(w2sX(se.x) + 60, w2sY(se.y) + 60); await sleep(30);
      const rA = scene.items.find(i => i.id === 'grpa');
      log('grupo: redimensionar escala os dois', rA.w > wa0 + 1, `w ${wa0.toFixed(0)}→${rA.w.toFixed(0)}`);
      selIds = ['grpa', 'grpb']; ungroupSel();
      log('grupo: Ctrl+Shift+G limpa o g', scene.items.filter(i => /^grp/.test(i.id)).every(i => !i.g), '');
      scene.items = scene.items.filter(i => !/^grp/.test(i.id)); selIds = []; save(); draw();
    }

    // escrita concorrente: o agente escreve enquanto o editor tem mudança
    // pendente; o save por diff não pode apagar o item do agente
    {
      await sleep(400); // deixa o save pendente dos toggles completar antes
      const ag = { id: 'ag-conc', type: 'rect', x: 1500, y: 1500, w: 40, h: 40 };
      const mine = { id: 'hm-conc', type: 'rect', x: 1560, y: 1500, w: 40, h: 40 };
      scene.items.push(mine);
      dirty = true; // editor "ocupado": o SSE do agente vira stale, não apply
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ add: [ag] }) });
      await sleep(60);
      await doSave(); // nosso save manda só hm-conc; ag-conc não está no nosso diff
      const merged = await (await fetch('/scene')).json();
      log('concorrência: agente e humano sobrevivem juntos', merged.items.some(i => i.id === 'ag-conc') && merged.items.some(i => i.id === 'hm-conc'), '');
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ remove: ['ag-conc', 'hm-conc'] }) });
      await sleep(500);
      if (scene.items.some(i => i.id === 'ag-conc' || i.id === 'hm-conc')) {
        applyIncoming(await (await fetch('/scene')).json()); // SSE caiu em stale; reconcilia
      }
    }

    // zoom não quebra com board degenerado nem com item corrompido (NaN)
    {
      const keep = scene;
      scene = { version: 1, items: [{ id: 'degen', type: 'rect', x: 100, y: 100, w: 0, h: 0 }] };
      zoomToFit();
      log('zoom: bbox degenerada não gera NaN', Number.isFinite(z) && z > 0 && !/NaN/.test(zoomLbl.textContent), `z=${z}`);
      applyIncoming({ version: 1, rev: (lastRev || 0) + 1, items: [
        { id: 'ok1', type: 'rect', x: 0, y: 0, w: 50, h: 50 },
        { id: 'bad1', type: 'rect', x: NaN, y: 0, w: 50, h: 50 },
        { id: 'fr1', type: 'frame', x: 10, y: 10, w: 40, h: 40 },
      ] });
      const b1 = scene.items.find(i => i.id === 'bad1');
      const fr = scene.items.find(i => i.id === 'fr1');
      log('sanitize: NaN→0, frame→rect, zoom íntegro', b1 && b1.x === 0 && fr && fr.type === 'rect' && Number.isFinite(z), '');
      scene = keep; rebase(keep); draw();
    }

    // merge-patch: agente toca só um campo, coordenadas do humano sobrevivem
    {
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ add: [{ id: 'mp1', type: 'rect', x: 100, y: 100, w: 40, h: 40, fill: '#fff' }] }) });
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ update: [{ id: 'mp1', type: 'rect', x: 222, y: 100, w: 40, h: 40, fill: '#fff' }] }) });
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ update: [{ id: 'mp1', fill: '#f00', by: 'agent' }], merge: true }) });
      const sc = await (await fetch('/scene')).json();
      const mp = sc.items.find(i => i.id === 'mp1');
      log('merge-patch: agente muda só o fill e x do humano sobrevive', !!mp && mp.x === 222 && mp.fill === '#f00' && mp.by === 'agent', mp && `x=${mp.x} fill=${mp.fill}`);
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ remove: ['mp1'] }) });
    }

    // leitura incremental por rev
    {
      const before = await (await fetch('/scene')).json();
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ add: [{ id: 'sd1', type: 'rect', x: 0, y: 0, w: 10, h: 10 }] }) });
      const d = await (await fetch('/scene?since=' + before.rev)).json();
      log('since: diff devolve só o item novo', !!d.changed && d.changed.some(i => i.id === 'sd1') && !d.truncated, '');
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ remove: ['sd1'] }) });
    }

    // /wait entrega os ids que mudaram (o agente não precisa reler tudo).
    // Caminho imediato: a mudança acontece antes do wait chegar ao servidor —
    // sob virtual time do headless, a corrida long-poll não é determinística.
    {
      const cur = await (await fetch('/scene')).json();
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ add: [{ id: 'wi1', type: 'rect', x: 0, y: 0, w: 10, h: 10 }] }) });
      const w = await (await fetch('/wait?rev=' + cur.rev + '&timeout=3000')).json();
      log('wait: resolve com ids mudados', w.changed && Array.isArray(w.ids) && w.ids.includes('wi1'), JSON.stringify(w).slice(0, 80));
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ remove: ['wi1'] }) });
    }

    // substituição total sem rev é rejeitada
    {
      const r = await fetch('/scene', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ items: [] }) });
      log('replace sem rev é rejeitado (400)', r.status === 400, 'http ' + r.status);
    }

    // imagens externalizadas
    {
      const tiny = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
      const r = await (await fetch('/img', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data: tiny }) })).json();
      const ok = r.src && r.src.startsWith('/img/');
      const back = ok ? await fetch(r.src) : null;
      log('img: dataURL vira arquivo e volta servido', !!(ok && back && back.ok), r.src || '');
    }

    // presença do humano
    {
      await fetch('/state', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sel: ['abc'], view: { x: 1, y: 2, w: 300, h: 200, z: 1 } }) });
      const st = await (await fetch('/state')).json();
      log('state: humano publica seleção/viewport', st.sel.includes('abc') && st.view.w === 300, '');
    }

    // layout no servidor
    {
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ add: [
        { id: 'la1', type: 'rect', x: 50, y: 5000, w: 40, h: 40 },
        { id: 'la2', type: 'rect', x: 110, y: 5017, w: 40, h: 40 },
      ] }) });
      await fetch('/layout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids: ['la1', 'la2'], op: 'align-top' }) });
      const sc = await (await fetch('/scene')).json();
      const a = sc.items.find(i => i.id === 'la1'), b = sc.items.find(i => i.id === 'la2');
      log('layout: align-top igualiza y', a.y === b.y && a.y === 5000, `y ${a.y}/${b.y}`);
      await fetch('/layout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids: ['la1', 'la2'], op: 'place-right' }) });
      const sc2 = await (await fetch('/scene')).json();
      const others = sc2.items.filter(i => i.id !== 'la1' && i.id !== 'la2' && Number.isFinite(i.x)).map(i => i.x + (i.w || 0));
      const maxOther = others.length ? Math.max(...others) : 0;
      const la = sc2.items.find(i => i.id === 'la1');
      log('layout: place-right move para depois de tudo', la.x > 50 && la.x >= maxOther, `x=${la.x} maxOutro=${maxOther}`);
      await fetch('/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ remove: ['la1', 'la2'] }) });
    }

    // evento ops do SSE aplicado localmente (caminho do agente ao vivo)
    {
      applyOpsEvent({ rev: lastRev + 1, ops: { add: [{ id: 'op1', type: 'rect', x: 4000, y: 4000, w: 10, h: 10, by: 'agent' }], update: [], remove: [] } });
      const has = scene.items.some(i => i.id === 'op1');
      log('ops: add do agente entra na cena e pisca', has && flashMap.has('op1'), '');
      applyOpsEvent({ rev: lastRev + 1, ops: { add: [], update: [{ id: 'op1', type: 'rect', x: 4000, y: 4000, w: 10, h: 10, by: 'agent', fill: '#0f0' }], remove: [] } });
      const upd = scene.items.find(i => i.id === 'op1');
      log('ops: update substitui o item por id', !!upd && upd.fill === '#0f0', '');
      applyOpsEvent({ rev: lastRev + 1, ops: { add: [], update: [], remove: ['op1'] } });
      log('ops: remove tira o item', !scene.items.some(i => i.id === 'op1'), '');
      flashMap.clear();
    }

    // undo com reinserção: desfazer um delete não apaga o que o agente fez depois
    {
      scene.items.push(
        { id: 'u1', type: 'rect', x: 0, y: 0, w: 10, h: 10 },
        { id: 'u2', type: 'rect', x: 5, y: 0, w: 10, h: 10 },
        { id: 'u3', type: 'rect', x: 10, y: 0, w: 10, h: 10 },
      );
      deleteIds(['u2']);
      scene.items.push({ id: 'ag-undo', type: 'rect', x: 0, y: 0, w: 10, h: 10, by: 'agent' });
      undo();
      const idx = scene.items.findIndex(i => i.id === 'u2');
      const agOk = scene.items.some(i => i.id === 'ag-undo');
      log('undo: reinserção na posição original sem desfazer o agente', idx > 0 && scene.items[idx - 1].id === 'u1' && scene.items[idx + 1].id === 'u3' && agOk, 'idx=' + idx);
      redo();
      log('redo: apaga de novo', !scene.items.some(i => i.id === 'u2'), '');
      scene.items = scene.items.filter(i => !['u1', 'u2', 'u3', 'ag-undo'].includes(i.id));
      selIds = []; save(); draw();
    }

    // lock de objeto
    {
      scene.items.push({ id: 'lk1', type: 'rect', x: 2500, y: 2500, w: 40, h: 40 });
      selIds = ['lk1'];
      toggleLockSel();
      const hit = hitItem(2520, 2520);
      log('lock: travado não é atingível pelo hitTest', !hit || hit.id !== 'lk1', '');
      toggleLockSel();
      const hit2 = hitItem(2520, 2520);
      log('lock: destravado volta a ser atingível', !!hit2 && hit2.id === 'lk1', '');
      scene.items = scene.items.filter(i => i.id !== 'lk1');
      selIds = []; save(); draw();
    }

    // busca
    {
      scene.items.push({ id: 'sr1', type: 'text', text: 'ZebraBusca xyz', x: 0, y: 0, fontSize: 16 });
      openSearch();
      searchIn.value = 'zebra';
      runSearch();
      const n = searchMatches.length;
      stepSearch(1);
      const sel = selIds.includes('sr1');
      closeSearch();
      scene.items = scene.items.filter(i => i.id !== 'sr1');
      selIds = []; save(); draw();
      log('busca: acha texto e seleciona', n === 1 && sel, 'n=' + n);
    }

    // link de navegação + modo apresentação
    {
      scene.items.push(
        { id: 'ln1', type: 'rect', x: 0, y: 0, w: 40, h: 40 },
        { id: 'ln2', type: 'rect', x: 500, y: 0, w: 40, h: 40 },
      );
      z = 1; panX = 0; panY = 0; draw();
      selIds = ['ln1'];
      linkFrom = 'ln1';
      pd(520, 20); pu(520, 20);
      await sleep(20);
      const src = scene.items.find(i => i.id === 'ln1');
      log('link: modo link + clique no destino grava link.to', !!src && !!src.link && src.link.to === 'ln2', JSON.stringify(src && src.link));
      togglePresent();
      const inPresent = present;
      await sleep(400); // deixa a animação do jump terminar
      togglePresent();
      log('present: entra e sai sem erro', inPresent && !present, '');
      scene.items = scene.items.filter(i => !['ln1', 'ln2'].includes(i.id));
      selIds = []; save(); draw();
    }

    // exports sem exceção (buildSvg/toForeign puros: download não roda no headless)
    {
      let ok = true, msg = '', svg = '';
      try { svg = buildSvg(); } catch (e) { ok = false; msg = e.message; }
      log('export svg: gera markup válido', ok && svg.startsWith('<svg') && svg.includes('</svg>') && (svg.match(/<(path|text|polyline|image)/g) || []).length >= 3, msg || (svg.length + ' bytes'));
      let ok2 = true, msg2 = '';
      try { await toForeign(); } catch (e) { ok2 = false; msg2 = e.message; }
      log('export excalidraw: toForeign sem exceção', ok2, msg2);
    }

    // replace total com rev tira snapshot automático
    {
      const cur = await (await fetch('/scene')).json();
      await fetch('/scene?rev=' + (cur.rev || 0), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ version: 1, title: cur.title, items: cur.items }) });
      const h = await (await fetch('/history')).json();
      log('history: replace total tira snapshot pre-replace', h.some(x => x.tag === 'pre-replace'), '');
    }

    // i18n do chrome
    {
      toggleLang();
      const enMenu = Array.from(menuEl.querySelectorAll('button span')).some(s => /Export PNG/.test(s.textContent));
      toggleLang();
      log('i18n: toggle troca os rótulos do menu', enMenu, '');
    }

    await sleep(700);
    const persisted = await (await fetch('/scene')).json();
    log('persistência: board salvo via HTTP', Array.isArray(persisted.items) && persisted.items.length === scene.items.length, `http=${persisted.items.length} local=${scene.items.length}`);
  } catch (err) {
    log('exceção no harness', false, err.message + ' @ ' + err.stack?.split('\n')[0]);
  }
  clearTimeout(saveTimer);
  dirty = false;
  const cur = await (await fetch('/scene')).json();
  await fetch('/scene?rev=' + (cur.rev || 0), { method: 'POST', headers: { 'content-type': 'application/json' }, body: boardSnapshot });
  await new Promise(r => setTimeout(r, 500));
  out.textContent += '\nFIM';
}

</script>
</body>
</html>
